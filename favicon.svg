<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="h" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffc2d1"/>
      <stop offset="55%" stop-color="#fb6f92"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </radialGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFA94D"/>
    </linearGradient>
  </defs>
  <!-- v31 对齐根治：心+星整体视觉重心精确钉到 (32, 32) = viewBox 中心
       心形 y 12-52 (高 40px, 中心 32)
       心形 x 10-54 (宽 44px, 中心 32)
       黄色星位置 (32, 32) viewBox 几何中心，半径 7
       加 1.0px 白色描边补偿小尺寸渲染细节丢失 -->
  <path d="M32 52 C 32 52, 10 40, 10 24 C 10 16, 16 12, 22 12 C 26 12, 29.5 14, 32 17 C 34.5 14, 38 12, 42 12 C 48 12, 54 16, 54 24 C 54 40, 32 52, 32 52 Z"
        fill="url(#h)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.0"/>
  <path d="M30 49 C 30 49, 14 38, 14 26" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.0" stroke-linecap="round"/>
  <!-- 黄色星精确位于 viewBox 中心 (32, 32)，半径 7 -->
  <g transform="translate(32 32)">
    <path d="M 0 -7 L 1.6 -2 L 7 0 L 1.6 2 L 0 7 L -1.6 2 L -7 0 L -1.6 -2 Z"
          fill="url(#s)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.6"/>
  </g>
</svg>
