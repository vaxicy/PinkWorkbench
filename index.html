    <div class="water-setting-row"><span>提醒间隔</span>${[30,60,90].map(n=>`<button class="water-pill ${w.intervalMin===n?'on':''}" onclick="setWaterOption('intervalMin',${n})">${n} 分钟</button>`).join('')}<button class="water-pill" onclick="customWaterSetting('intervalMin')">自定义</button></div>
    <div class="water-setting-row"><span>每日目标</span>${[30,40,50].map(n=>`<button class="water-pill ${w.goalSips===n?'on':''}" onclick="setWaterOption('goalSips',${n})">${n} 口</button>`).join('')}<button class="water-pill" onclick="customWaterSetting('goalSips')">自定义</button></div>
    <div class="water-reminder-actions"><button class="primary" type="button" onclick="toggleWaterReminder()">${running?'暂停提醒':'开始提醒'}</button><label class="water-notify-switch ${notifyReady?'on':''}" role="switch" aria-checked="${notifyReady}" tabindex="0" onclick="event.preventDefault();toggleWaterNotifications()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleWaterNotifications()}"><span><b>弹出通知</b><small>${notifyReady?'已开启':'未开启'}</small></span><input type="checkbox" ${notifyReady?'checked':''} tabindex="-1" aria-hidden="true"><i aria-hidden="true"></i></label></div>
    <div class="water-quick"><button onclick="logWater(3)">我喝了 3 口</button><button onclick="logWater(5)">我喝了 5 口</button><button onclick="logWater(8)">我喝了 8 口</button></div>
    <div class="water-notify-note">${notifyReady?'已允许系统通知；在 iPhone 上请从主屏幕打开治愈花园。':'iPhone 请先点分享 → 添加到主屏幕，再点击"开启弹出通知"。页面保持打开时也会正常倒计时提醒。'}</div>
    <div class="water-records"><div class="water-records-head"><span>今日记录 · ${w.records.length} 次</span><button onclick="resetWaterRecords()">清空今日记录</button></div>${w.records.length?w.records.slice().reverse().slice(0,5).map(row=>`<div class="water-record"><span>${row.time} · ${row.sips} 口</span><button onclick="undoWaterLog(${row.id})" title="撤销">×</button></div>`).join(''):'<div class="empty-tip">还没有记录，先喝几口水吧 💧</div>'}</div>`;
  startWaterTicker();
  return card;
}
function setWaterOption(key,value){const w=ensureWaterState();w[key]=parseInt(value)||w[key];if(w.active)w.nextReminderAt=Date.now()+w.intervalMin*60000;saveState();syncRemoteReminder();render();}
async function customWaterSetting(key){
  const w=ensureWaterState();
  const labels={goalSips:'每日目标口数',sipsPerReminder:'每次提醒口数',intervalMin:'提醒间隔（分钟）'};
  const value=await showModal({title:labels[key]||'喝水设置',input:true,inputValue:String(w[key]),placeholder:'请输入数字'});
  const number=parseInt(value);if(!number)return;
  const limits={goalSips:[1,200],sipsPerReminder:[1,30],intervalMin:[1,Number.MAX_SAFE_INTEGER]}[key];
  if(number<limits[0]||number>limits[1])return showModal({title:'数值不合适',body:`请输入 ${limits[0]} - ${limits[1]} 之间的数字。`,noCancel:true});
  setWaterOption(key,number);
}
function toggleWaterReminder(){
  const w=ensureWaterState();w.active=!w.active;w.nextReminderAt=w.active?Date.now()+w.intervalMin*60000:0;saveState();render();
  syncRemoteReminder();
}
function logWater(sips){
  const w=ensureWaterState(),before=waterTotal();
  w.records.push({id:Date.now(),time:nowTime(),sips:Math.max(1,parseInt(sips)||w.sipsPerReminder)});
  if(w.active)w.nextReminderAt=Date.now()+w.intervalMin*60000;
  const after=waterTotal();
  if(before<w.goalSips&&after>=w.goalSips&&!w.goalReached){w.goalReached=true;addEnergy(5);showHeartToast(5);}
  else showHeartToast(1);
  saveState();syncRemoteReminder();render();
}
function undoWaterLog(id){const w=ensureWaterState();w.records=w.records.filter(row=>row.id!==id);w.goalReached=waterTotal()>=w.goalSips;saveState();render();}
function resetWaterRecords(){const w=ensureWaterState();w.records=[];w.goalReached=false;saveState();render();}
function waterNotify(){
  const w=ensureWaterState();
  const title='💧 喝水提醒';const body='喝一口水，再继续今天的事情吧。';
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  // 用带时间戳的唯一 tag，避免 iOS 把新通知当作旧通知的替换而不弹
  const tag='water-reminder-'+Date.now();
  if(navigator.serviceWorker?.ready)navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,icon:'./icon-192.png?v=89',tag,data:{url:'./index.html#plan'}})).catch(()=>{});
  else try{new Notification(title,{body,icon:'./icon-192.png?v=89',tag});}catch(_){ }
  if(navigator.vibrate)navigator.vibrate([80,60,80]);
}
// 前台补偿：App 重新回到前台/被打开时，把错过的提醒补回来（iOS 后台被系统杀掉 SW 时的兜底）
let _missedReminderShown=false;
function checkMissedReminders(){
  if(waterRequesting)return;
  const w=ensureWaterState();
  if(!w.active||!w.nextReminderAt)return;
  if(Date.now()>=w.nextReminderAt){
    // 错过的提醒，立即补一次本地通知
    waterNotify();
    w.nextReminderAt=Date.now()+w.intervalMin*60000;saveState();syncRemoteReminder();
    if(!_missedReminderShown){
      _missedReminderShown=true;
      showModal({title:'💧 该喝水啦',body:'刚刚错过了一次后台提醒，已经为你补上。快喝一口水，再继续今天的事情吧～',noCancel:true});
    }
  }
}
async function requestWaterNotifications(){
  if(typeof Notification==='undefined')return showModal({title:'当前设备不支持',body:'这个浏览器没有通知能力，可以继续使用页面倒计时和喝水记录。',noCancel:true});
  const standalone=window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone;
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)&&!standalone)return showModal({title:'先添加到主屏幕',body:'请点击 Safari 的分享按钮，选择"添加到主屏幕"，再从桌面打开治愈花园并开启通知。iPhone 的网页通知需要主屏幕网页应用。',noCancel:true});
  waterRequesting=true;
  let permission;
  try{permission=await Notification.requestPermission();}
  finally{waterRequesting=false;}
  const w=ensureWaterState();
  if(permission==='granted'){
    try{await subscribeRemotePush();showModal({title:'通知已开启',body:'后台推送已接通。iPhone 上关闭 App 后系统仍可能不弹，但重新打开治愈花园时会自动补上错过的提醒。',noCancel:true});}
    catch(error){
      w.notify=false;w.pushSubscribed=false;saveState();render();
      showModal({title:'已开启本地提醒',body:'系统通知权限已允许，但后台推送暂时连不上（可能是网络波动）。你仍会在页面打开时收到喝水提醒，下次重新打开 App 时会自动重试接通后台推送。',noCancel:true});
      return;
    }
  }else{w.notify=false;saveState();render();}
  if(permission!=='granted')showModal({title:'通知没有开启',body:'可以在浏览器或系统设置里允许通知，页面内倒计时仍然可以使用。',noCancel:true});
}
function openWaterGuide(){showModal({title:'💧 喝水提醒',body:'设置每次提醒喝几口、提醒间隔和每日目标。开启提醒后，页面打开时会倒计时；iPhone 请添加到主屏幕后再开启系统通知。',noCancel:true});}
let waterNotifyBusy=false;
let waterRequesting=false;
function updateWaterNotifyUi(ready,busy=false){
  document.querySelectorAll('.water-notify-switch').forEach(el=>{
    el.classList.toggle('on',ready);el.classList.toggle('busy',busy);el.setAttribute('aria-checked',String(ready));el.setAttribute('aria-busy',String(busy));
    const small=el.querySelector('small');if(small)small.textContent=busy?'处理中':(ready?'已开启':'未开启');
    const input=el.querySelector('input');if(input)input.checked=ready;
  });
}
async function toggleWaterNotifications(){
  if(waterNotifyBusy)return;
  waterNotifyBusy=true;updateWaterNotifyUi(false,true);
  const w=ensureWaterState();
  const permission=typeof Notification!=='undefined'?Notification.permission:'unsupported';
  try{
    if(w.notify&&w.pushSubscribed&&permission==='granted')await unsubscribeRemotePush();
    else await requestWaterNotifications();
  }finally{
    waterNotifyBusy=false;
    const current=ensureWaterState();
    updateWaterNotifyUi(typeof Notification!=='undefined'&&Notification.permission==='granted'&&current.notify&&current.pushSubscribed);
  }
}
async function testWaterPush(){
  const w=ensureWaterState();
  if(!w.pushSubscribed)return showModal({title:'先开启通知',body:'请先点"开启通知"完成订阅，再测试后台推送。',noCancel:true});
  try{
    const res=await fetch(`${PUSH_API}/devices/${encodeURIComponent(w.deviceId)}/test`,{method:'POST'});
    if(!res.ok)throw new Error('测试请求返回 '+res.status);
    showModal({title:'已发送测试推送',body:'如果 1-2 秒内没有弹出通知，说明当前环境（如 iOS 已划掉 App）后台推送不稳定，请保持页面打开或依赖重新打开时的补提醒。',noCancel:true});
  }catch(err){showModal({title:'测试失败',body:err.message+'。可以继续使用页面内提醒。',noCancel:true});}
}
function startWaterTicker(){
  if(waterTicker)return;
  waterTicker=setInterval(()=>{
    const w=ensureWaterState();
    if(w.active&&w.nextReminderAt&&Date.now()>=w.nextReminderAt){waterNotify();w.nextReminderAt=Date.now()+w.intervalMin*60000;saveState();syncRemoteReminder();}

  card.innerHTML=`<div class="card-title">📒 备忘录</div><div class="card-sub">随手记，想法不丢</div>`;
  const list=div();list.id='memoList';
  if(!state.plan.memos.length)list.innerHTML='<div class="empty-tip">还没有备忘录，下面写一条吧</div>';
  else state.plan.memos.slice().reverse().forEach(m=>{
    const item=div('memo-item');
    const time=new Date(m.updatedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    item.innerHTML=`<div class="memo-head"><b>${esc(m.title||'无标题')}</b><span class="memo-time">${time}</span></div>
      <div class="memo-body">${esc(m.content).replace(/\n/g,'<br>')}</div>
      <div class="task-actions" style="opacity:1;justify-content:flex-end;"><button onclick="editMemo(${m.id},event)">✏️</button><button onclick="delMemo(${m.id},event)">🗑️</button></div>`;
    list.appendChild(item);
  });
  card.appendChild(list);
  const form=div();form.style.marginTop='14px';
  form.innerHTML=`<div class="form-row"><input id="memoTitle" placeholder="标题（可选）"/></div>
    <div class="form-row"><textarea id="memoContent" placeholder="写点什么…" rows="3" class="memo-textarea"></textarea></div>
    <button class="btn-pink" onclick="addMemo()">➕ 添加备忘录</button>`;
  card.appendChild(form);
  return card;
}
function addMemo(){const title=document.getElementById('memoTitle').value.trim();const content=document.getElementById('memoContent').value.trim();if(!content&&!title)return;const now=Date.now();state.plan.memos.push({id:now,title,content,createdAt:now,updatedAt:now});saveState();render();}
function delMemo(id,e){e.stopPropagation();showConfirm('删除这条备忘录？').then(yes=>{if(yes){state.plan.memos=state.plan.memos.filter(x=>x.id!==id);saveState();render();}});}
function editMemo(id,e){e.stopPropagation();const m=state.plan.memos.find(x=>x.id===id);const row=e.target.closest('.memo-item');row.innerHTML='';const f=div('inline-form');const t=document.createElement('input');t.value=m.title;t.placeholder='标题';const c=document.createElement('textarea');c.value=m.content;c.rows=3;c.className='memo-textarea';const ok=document.createElement('button');ok.className='btn-small';ok.textContent='保存';ok.onclick=()=>{m.title=t.value.trim();m.content=c.value.trim();m.updatedAt=Date.now();saveState();render();};f.append(t,c,ok);row.appendChild(f);}

/* ================= 习惯打卡 ================= */
const HABIT_CATS=[{id:'health',icon:'💪',name:'健康'},{id:'study',icon:'📚',name:'学习'},{id:'sport',icon:'🏃',name:'运动'},{id:'life',icon:'🌸',name:'生活'}];
function habitTodayValue(h){const v=h.logs[todayKey()];return typeof v==='number'?v:0;}
function habitDoneToday(h){return h.type==='count'?habitTodayValue(h)>=h.target:!!h.logs[todayKey()];}
function habitStreak(logs){
  let streak=0;let d=todayKey();
  if(!logs[d])d=addDays(d,-1);
  while(logs[d]){streak++;d=addDays(d,-1);}
  return streak;
}
function last7Days(){const arr=[];const t=todayKey();for(let i=6;i>=0;i--)arr.push(addDays(t,-i));return arr;}
function habitWeekDone(h){
  return last7Days().map(d=>{
    const v=h.logs[d]||0;
    return h.type==='count'?v>=h.target:!!v;
  });
}
function renderHabit(){
  const card=div('card');
  card.innerHTML=`<div class="card-title">🎯 习惯打卡</div><div class="card-sub">每天一点点，养成好习惯</div>`;
  // 今日概览
  const total=state.plan.habits.length;
  const doneCount=state.plan.habits.filter(habitDoneToday).length;
  const bestStreak=Math.max(0,...state.plan.habits.map(h=>habitStreak(h.logs)));
  const summary=div('habit-summary');
  summary.innerHTML=`<span>今日完成 <b>${doneCount}/${total}</b></span><span>完成率 <b>${total?Math.round(doneCount/total*100):0}%</b></span><span>🔥 最长连续 <b>${bestStreak}</b> 天</span>`;
  card.appendChild(summary);
  const list=div();list.id='habitList';
  if(!state.plan.habits.length)list.innerHTML='<div class="empty-tip">还没有习惯，下方添加一个吧</div>';
  else state.plan.habits.forEach(h=>{
    const done=habitDoneToday(h);
    const streak=habitStreak(h.logs);
    const week=habitWeekDone(h);
    const cat=HABIT_CATS.find(c=>c.id===h.category)||HABIT_CATS[3];
    const row=div('task habit-row'+(done?' done':''));
    let controls='';
    if(h.type==='count'){
      const val=habitTodayValue(h);
      controls=`<div class="habit-counter"><button onclick="decHabit(${h.id},event)">−</button><span>${val}/${h.target} ${esc(h.unit)}</span><button onclick="incHabit(${h.id},event)">+</button></div>`;
    }else{
      controls=`<div class="check${done?' on':''}" onclick="toggleHabit(${h.id},event)"></div>`;
    }
    row.innerHTML=`${controls}
      <div class="info"><b>${esc(h.icon)} ${esc(h.name)}</b>
        <span><span class="habit-cat">${cat.icon} ${cat.name}</span> · 🔥 连续 ${streak} 天 · 近 7 天 ${week.filter(Boolean).length}/7</span>
        <div class="week-dots">${week.map(x=>`<i class="dot${x?' on':''}"></i>`).join('')}</div>
      </div>
      <div class="task-actions"><button onclick="editHabit(${h.id},event)">✏️</button><button onclick="delHabit(${h.id},event)">🗑️</button></div>`;
    list.appendChild(row);
  });
  card.appendChild(list);
  // 添加表单
  const form=div();form.style.marginTop='14px';
  form.innerHTML=`<div class="form-row"><input id="habitName" placeholder="习惯名称，如：喝水 2000ml"/></div>
    <div class="emoji-grid" id="habitIconGrid"></div>
    <div class="habit-type-row">
      <button class="habit-type-btn active" data-type="check" onclick="setHabitType('check')">单次打卡</button>
      <button class="habit-type-btn" data-type="count" onclick="setHabitType('count')">计数打卡</button>
    </div>
    <div class="form-row habit-count-row" id="habitCountRow" style="display:none;">
      <input id="habitTarget" type="number" min="1" value="8" style="max-width:80px;"/> <input id="habitUnit" placeholder="单位，如：杯" value="杯" style="max-width:80px;"/>
    </div>
    <div class="form-row"><div id="habitCatBox"></div></div>
    <button class="btn-pink" onclick="addHabit()">➕ 添加习惯</button>`;
  card.appendChild(form);
  const grid=card.querySelector('#habitIconGrid');
  window.habitIconVal='⭐';window.habitTypeVal='check';window.habitCatVal='health';
  ['⭐','💧','📚','🏃','🧘','💊','🍎','🌙','☀️','✍️','🎯','💰'].forEach(em=>{
    const s=document.createElement('span');s.textContent=em;if(em==='⭐')s.style.background='var(--cream)';
    s.onclick=()=>{window.habitIconVal=em;Array.from(grid.children).forEach(c=>c.style.background='');s.style.background='var(--cream)';};
    grid.appendChild(s);
  });
  renderCustomSelect(form.querySelector('#habitCatBox'),HABIT_CATS.map(c=>({value:c.id,label:`${c.icon} ${c.name}`})),'health','选择分类');
  return card;
}
function setHabitType(t){
  window.habitTypeVal=t;
  document.querySelectorAll('.habit-type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===t));
  document.getElementById('habitCountRow').style.display=t==='count'?'flex':'none';
}
function addHabit(){
  const name=document.getElementById('habitName').value.trim();if(!name)return;
  const icon=window.habitIconVal||'⭐';
  const type=window.habitTypeVal||'check';
  const target=type==='count'?Math.max(1,parseInt(document.getElementById('habitTarget').value,10)||1):1;
  const unit=type==='count'?(document.getElementById('habitUnit').value.trim()||'次'):'天';
  const catBox=document.getElementById('habitCatBox');
  const category=getCustomSelectValue(catBox)||'life';
  state.plan.habits.push({id:Date.now(),name,icon,type,target,unit,category,logs:{}});
  saveState();render();
}
function toggleHabit(id,e){
  e.stopPropagation();const h=state.plan.habits.find(x=>x.id===id);if(!h||h.type!=='check')return;
  const wasDone=habitDoneToday(h);const t=todayKey();
  if(h.logs[t])delete h.logs[t];else h.logs[t]=1;
  if(!wasDone&&habitDoneToday(h)){addEnergy(5);showMiniConfetti(e.target);showHeartToast(5);}
  saveState();render();
}
function incHabit(id,e){
  e.stopPropagation();const h=state.plan.habits.find(x=>x.id===id);if(!h||h.type!=='count')return;
  const wasDone=habitDoneToday(h);const t=todayKey();
  h.logs[t]=(habitTodayValue(h)||0)+1;
  if(!wasDone&&habitDoneToday(h)){addEnergy(5);showMiniConfetti(e.target);showHeartToast(5);}
  saveState();renderHabitList();
}
function decHabit(id,e){
  e.stopPropagation();const h=state.plan.habits.find(x=>x.id===id);if(!h||h.type!=='count')return;
  const t=todayKey();const v=habitTodayValue(h);
  if(v>1)h.logs[t]=v-1;else delete h.logs[t];
  saveState();renderHabitList();
}
function renderHabitList(){
  const box=document.getElementById('contentBox');if(!box)return;
  const old=document.getElementById('habitList');if(!old)return;
  const newList=renderHabit().querySelector('#habitList');
  old.replaceWith(newList);
}
function delHabit(id,e){e.stopPropagation();showConfirm('确定删除这个习惯？打卡记录也会一并删除').then(yes=>{if(yes){state.plan.habits=state.plan.habits.filter(x=>x.id!==id);saveState();render();}});}
function editHabit(id,e){
  e.stopPropagation();const h=state.plan.habits.find(x=>x.id===id);const row=e.target.closest('.task');row.innerHTML='';
  const f=div('inline-form');
  const ic=document.createElement('input');ic.value=h.icon;ic.placeholder='图标';ic.style.maxWidth='60px';
  const t=document.createElement('input');t.value=h.name;
  const typeWrap=div();typeWrap.innerHTML=`<label style="font-size:12px;color:var(--brown-light);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="editHabitCount" ${h.type==='count'?'checked':''}/> 计数型</label>`;
  const targetIn=document.createElement('input');targetIn.type='number';targetIn.min=1;targetIn.value=h.target;targetIn.placeholder='目标';targetIn.style.maxWidth='70px';
  const unitIn=document.createElement('input');unitIn.value=h.unit;unitIn.placeholder='单位';unitIn.style.maxWidth='60px';
  const catWrap=div();
  renderCustomSelect(catWrap,HABIT_CATS.map(c=>({value:c.id,label:`${c.icon} ${c.name}`})),h.category,'分类');
  const ok=document.createElement('button');ok.className='btn-small';ok.textContent='保存';
  ok.onclick=()=>{
    h.icon=ic.value.trim()||h.icon;h.name=t.value.trim()||h.name;
    h.type=document.getElementById('editHabitCount').checked?'count':'check';
    h.target=Math.max(1,parseInt(targetIn.value,10)||1);h.unit=unitIn.value.trim()||'次';h.category=getCustomSelectValue(catWrap)||h.category;
    saveState();render();
  };
  f.append(ic,t,typeWrap,targetIn,unitIn,catWrap,ok);row.appendChild(f);
}

/* ================= 自定义选择器组件 ================= */
function renderCustomSelect(container,options,value,placeholder='请选择'){
  container.innerHTML='';container.className='custom-select';
  const selected=options.find(o=>o.value===value)||options[0];
  const trigger=div('select-trigger');trigger.innerHTML=`<span>${selected?selected.label:placeholder}</span>`;
  const opts=div('select-options custom-scroll');
  options.forEach(o=>{const d=div('select-option');d.textContent=o.label;d.classList.toggle('on',o.value===value);d.onclick=(e)=>{e.stopPropagation();trigger.querySelector('span').textContent=o.label;opts.querySelectorAll('.select-option').forEach(x=>x.classList.remove('on'));d.classList.add('on');opts.classList.remove('show');container.dataset.value=o.value;};opts.appendChild(d);});
  trigger.onclick=(e)=>{e.stopPropagation();document.querySelectorAll('.select-options').forEach(x=>{if(x!==opts)x.classList.remove('show');});opts.classList.toggle('show');setTimeout(()=>initCustomScrollbars(),0);};
  container.appendChild(trigger);container.appendChild(opts);container.dataset.value=value||'';
  initCustomScrollbars();
}
function getCustomSelectValue(container){return container.dataset.value;}
document.addEventListener('click',()=>document.querySelectorAll('.select-options').forEach(x=>x.classList.remove('show')));

/* ================= 自定义时间选择器 ================= */
let activeTimePicker=null;
function bindTimePicker(wrapId,value,onChange,allowEmpty=false){
  const wrap=document.getElementById(wrapId);if(!wrap)return;
  const display=wrap.querySelector('.time-display');
  display.textContent=value||(allowEmpty?'结束时间':'开始时间');
  display.onclick=(e)=>{e.stopPropagation();openTimePicker(value,(v)=>{value=v;display.textContent=value||(allowEmpty?'结束时间':'开始时间');if(onChange)onChange(value);},allowEmpty);};
}
function bindInlineTimePicker(container,value,onChange,allowEmpty=false){
  container.className='time-picker-wrap';
  const display=div('time-display');display.textContent=value||(allowEmpty?'结束':'开始');
  display.onclick=(e)=>{e.stopPropagation();openTimePicker(value,(v)=>{value=v;display.textContent=value||(allowEmpty?'结束':'开始');if(onChange)onChange(value);},allowEmpty);};
  container.appendChild(display);
}
function openTimePicker(currentValue,onDone,allowEmpty=false){
  let overlay=document.getElementById('timeModalOverlay');
  if(!overlay){
    overlay=document.createElement('div');overlay.className='time-modal-overlay';overlay.id='timeModalOverlay';
    const pop=div('time-pop');pop.id='timePopGlobal';overlay.appendChild(pop);
    document.body.appendChild(overlay);
  }
  overlay.classList.add('show');
  const pop=overlay.querySelector('#timePopGlobal');
  const [ch,cm]=currentValue?currentValue.split(':'):['12','00'];
  pop.innerHTML=`<div class="time-pop-title">选择时间</div><div class="time-columns">
    <div class="time-col" id="tpHour"></div>
    <div class="time-col" id="tpMin"></div>
  </div><div class="time-actions">
    ${allowEmpty?'<button class="cancel" id="tpClear">清空</button>':''}
    <button class="cancel" id="tpCancel">取消</button><button class="confirm" id="tpOk">确定</button>
  </div>`;
  const hCol=pop.querySelector('#tpHour');const mCol=pop.querySelector('#tpMin');
  for(let i=0;i<24;i++){const d=document.createElement('div');d.textContent=String(i).padStart(2,'0');d.classList.toggle('on',String(i).padStart(2,'0')===ch);d.onclick=()=>{hCol.querySelectorAll('div').forEach(x=>x.classList.remove('on'));d.classList.add('on');};hCol.appendChild(d);}
  for(let i=0;i<60;i+=5){const d=document.createElement('div');d.textContent=String(i).padStart(2,'0');d.classList.toggle('on',String(i).padStart(2,'0')===cm);d.onclick=()=>{mCol.querySelectorAll('div').forEach(x=>x.classList.remove('on'));d.classList.add('on');};mCol.appendChild(d);}
  setTimeout(()=>{hCol.querySelector('.on')?.scrollIntoView({block:'center'});mCol.querySelector('.on')?.scrollIntoView({block:'center'});initCustomScrollbars();},10);
  const close=()=>overlay.classList.remove('show');
  pop.querySelector('#tpOk').onclick=()=>{const h=hCol.querySelector('.on')?.textContent||ch;const m=mCol.querySelector('.on')?.textContent||cm;close();onDone(`${h}:${m}`);};
  pop.querySelector('#tpCancel').onclick=close;
  if(allowEmpty)pop.querySelector('#tpClear').onclick=()=>{close();onDone('');};
  overlay.onclick=e=>{if(e.target===overlay)close();};
}

function pickSequential(pool,key,n){
  const usedKey=key==='word'?'usedWordIdx':'usedSentenceIdx';
  const dateKey=key==='word'?'wordDate':'sentenceDate';
  const today=todayKey();
  if(!Array.isArray(state.english[usedKey]))state.english[usedKey]=[];
  if(state.english[dateKey]!==today || !Array.isArray(state.english[key+'Today']) || !state.english[key+'Today'].length){
    let used=state.english[usedKey];
    if(used.length+n>pool.length)used=state.english[usedKey]=[]; // 全部用完后开启新一轮
    const batch=[];
    for(let i=0;i<pool.length && batch.length<n;i++){ if(!used.includes(i))batch.push(i); }
    state.english[usedKey]=used.concat(batch);
    state.english[dateKey]=today;
    state.english[key+'Today']=batch;
    saveState();
  }
  return state.english[key+'Today'].map(i=>pool[i]);
}

function openEnglishCountSetting(){
  showModal({title:'每日推几个',body:'',noCancel:true,render:(body)=>{
    const mode=div('toggle');
    const mkMode=(label,val)=>{
      const b=document.createElement('button');b.textContent=label;
      if(state.english.linked===val)b.className='on';
      b.onclick=()=>{state.english.linked=val;saveState();render();openEnglishCountSetting();};
      return b;
    };
    mode.appendChild(mkMode('统一设置',true));
    mode.appendChild(mkMode('单独设置',false));
    body.appendChild(mode);

    const buildGrid=(label,cur,onPick)=>{
      const wrap=div();
      const t=div();t.textContent=label;t.style.cssText='font-size:13px;color:var(--brown-light);margin:14px 0 8px;';
      wrap.appendChild(t);
      const grid=div();grid.style.cssText='display:flex;gap:10px;justify-content:center;';
      [1,2,3,4,5].forEach(n=>{
        const b=document.createElement('button');b.textContent=n;b.style.cssText='width:44px;height:44px;border-radius:50%;border:1px solid var(--pink-2);font-size:16px;font-weight:700;cursor:pointer;background:'+(n===cur?'var(--pink-2)':'#fff')+';color:'+(n===cur?'#fff':'var(--brown)')+';';
        b.onclick=()=>onPick(n);
        grid.appendChild(b);
      });
      wrap.appendChild(grid);
      return wrap;
    };

    if(state.english.linked){
      body.appendChild(buildGrid('单词 + 长句统一数量',state.english.wordCount,n=>{
        state.english.wordCount=n;state.english.sentenceCount=n;saveState();hideModal();render();
      }));
    }else{
      body.appendChild(buildGrid('每日单词数量',state.english.wordCount,n=>{
        state.english.wordCount=n;saveState();hideModal();render();
      }));
      body.appendChild(buildGrid('每日长句数量',state.english.sentenceCount,n=>{
        state.english.sentenceCount=n;saveState();hideModal();render();
      }));
    }
  }});
}

const periodMoods=[{k:'happy',v:'😊'},{k:'sad',v:'😢'},{k:'angry',v:'😠'},{k:'tired',v:'😴'},{k:'anxious',v:'😰'},{k:'calm',v:'😌'}];

const flows=[
  {k:'none',v:'无',c:'#fff0f5'},{k:'spot',v:'点滴',c:'#ffd6e0'},{k:'light',v:'少量',c:'#ffc2d1'},
  {k:'medium',v:'中等',c:'#ff8fab'},{k:'heavy',v:'量多',c:'#ff7096'},{k:'very',v:'极多',c:'#ff4d6d'}
];
const colors=[
  {k:'pink',v:'粉红',c:'#ff9ebb'},{k:'bright',v:'鲜红',c:'#ff4d6d'},{k:'rose',v:'玫红',c:'#c9184a'},
  {k:'dark',v:'暗红',c:'#9e2a46'},{k:'brown',v:'褐色',c:'#8a6268'},{k:'blackish',v:'黑褐',c:'#5c3a41'}
];
function renderPeriod(box){
  const tabs=div('tabs');
  ['calendar','stats'].forEach(k=>{
    const btn=document.createElement('button');btn.className='tab'+(state.period.tab===k?' active':'');
    btn.textContent=k==='calendar'?'🗓️ 周期日历':'📊 周期统计';
    btn.onclick=()=>{state.period.tab=k;saveState();render();};
    tabs.appendChild(btn);

  if(state.period.tab==='calendar')renderPeriodCalendar(box);
  else renderPeriodStats(box);

function renderPeriodCalendar(box){
  const card=div('card');
  const today=todayKey();
  const view=state.period.viewDate||today;
  const vd=new Date(view+'T00:00:00');
  const y=vd.getFullYear(),m=vd.getMonth();
  const first=new Date(y,m,1);const startDay=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let html=`<div class="cal-nav"><button onclick="changePeriodMonth(-1)">‹</button><b>${y}年${monthNames[m]}</b><button onclick="changePeriodMonth(1)">›</button></div>`;
  html+=`<div class="cal-head"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>`;
  html+=`<div class="cal-days">`;
  const cells=[];
  for(let i=startDay-1;i>=0;i--)cells.push({d:prevDays-i,g:'prev'});
  for(let d=1;d<=daysInMonth;d++)cells.push({d,g:'cur',key:`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  const rem=(cells.length%7)||7;for(let i=1;i<=7-rem;i++)cells.push({d:i,g:'next'});
  const selectedDay=state.period.selectedDay||today;
  const isPeriodDay=key=>{
    if(state.period.currentStart&&key>=state.period.currentStart&&key<=today)return true;
    return state.period.records.some(r=>key>=r.startDate&&key<=r.endDate);
  };
  const isPredictDay=key=>{
    const last=getLastPeriodStart();if(!last)return false;
    const cycle=avgCycleLength();
    const next=addDays(last,cycle);
    return key>=next&&key<=addDays(next,4);
  };
  const isOvuDay=key=>{
    const last=getLastPeriodStart();if(!last)return false;
    const cycle=avgCycleLength();
    const ovu=addDays(last,cycle-14);
    return key===ovu;
  };
  cells.forEach(c=>{
    let cls='day';let emoji='';
    if(c.g==='cur'){
      if(c.key===today)cls+=' today';
      if(c.key===selectedDay)cls+=' selected';
      if(isPeriodDay(c.key)){cls+=' period';emoji=getDayMood(c.key)||'';}
      else if(isOvuDay(c.key))cls+=' ovu';
      else if(isPredictDay(c.key))cls+=' predict';
      html+=`<div class="${cls}" onclick="selectPeriodDay('${c.key}')">${c.d}${emoji?`<span class="emoji">${emoji}</span>`:''}</div>`;
    }else html+=`<div class="day" style="color:var(--brown-light);opacity:.5;">${c.d}</div>`;
  });
  html+=`</div><div class="legend"><span><i style="background:var(--pink-4)"></i>经期</span><span><i style="background:var(--blue)"></i>排卵日</span><span><i style="border:1px dashed var(--pink-3);background:#fff0f5"></i>预测经期</span><span><i style="box-shadow:0 0 0 2px var(--pink-3)"></i>今天</span></div>`;
  card.innerHTML=html;
  box.appendChild(card);
  renderPeriodFeels(box,selectedDay);
}
function getDayMood(key){const f=state.period.feelings[key];if(!f||!f.mood)return'';const m=periodMoods.find(x=>x.k===f.mood);return m?m.v:'';}

  const card=div('card');

  const f=state.period.feelings[day]||{};
  const circleItem=(list,key,dayKey)=>list.map(item=>`<div class="circle-item" onclick="setPeriodFeel('${day}','${dayKey}','${item.k}')"><div class="color-c ${f[key]===item.k?'on':''}" style="background:${item.c}"></div><span class="circle-label">${item.v}</span></div>`).join('');
  card.innerHTML=`<div class="card-title">${day} 经期记录</div>
    <div class="period-header">
      <div class="switch-row" style="margin-bottom:0;"><span class="switch-label">${isOn?'🔴 正在经期中':'⚪ 今日未开始经期'}</span><div class="switch ${isOn?'on':''}" onclick="togglePeriod()"></div></div>
      <div class="switch-hint">开启后从今天开始记录经期，关闭后自动结束本次经期</div>
    </div>
    <div class="feel-section"><div class="feel-label">心情</div><div class="mood-row">${periodMoods.map(m=>`<div class="mood-btn ${f.mood===m.k?'on':''}" onclick="setPeriodFeel('${day}','mood','${m.k}')">${m.v}</div>`).join('')}</div></div>
    <div class="feel-section"><div class="feel-label">痛经程度 <span class="slider-val">${f.pain||0}</span></div><div class="slider-row"><input type="range" min="0" max="10" value="${f.pain||0}" class="slider" oninput="updatePainVal(this,'${day}')"></div></div>
    <div class="feel-section"><div class="feel-label">症状</div><div class="sym-tags">${symptoms.map(s=>`<span class="sym-tag ${(f.symptoms||[]).includes(s)?'on':''}" onclick="toggleSymptom('${day}','${s}')">${s}</span>`).join('')}</div></div>
    <div class="feel-section"><div class="feel-label">流量</div><div class="color-circles">${circleItem(flows,'flow','flow')}</div></div>
    <div class="feel-section"><div class="feel-label">经血颜色</div><div class="color-circles">${circleItem(colors,'color','color')}</div></div>
    <button class="btn-pink" onclick="savePeriodFeel('${day}')">💾 保存记录</button>`;

function changePeriodMonth(delta){const d=new Date((state.period.viewDate||todayKey())+'T00:00:00');d.setMonth(d.getMonth()+delta);state.period.viewDate=d.toISOString().slice(0,10);saveState();render();}
function selectPeriodDay(key){state.period.selectedDay=key;saveState();render();}
function togglePeriod(){
  const today=todayKey();
  const sel=state.period.selectedDay||today;
  if(state.period.currentStart){
    // 结束经期
    const start=state.period.currentStart;
    const end=sel<start?start:sel;
    state.period.records.push({startDate:start,endDate:end});
    state.period.currentStart=null;
  }else{
    // 开始经期
    state.period.currentStart=sel;
  }
  addEnergy(1);showHeartToast(1);
  saveState();render();
}
function setPeriodFeel(day,key,val){const f=state.period.feelings[day]||{};f[key]=val;state.period.feelings[day]=f;}
function updatePainVal(input,day){const v=input.value;setPeriodFeel(day,'pain',v);const label=input.closest('.feel-section')?.querySelector('.feel-label .slider-val');if(label)label.textContent=v;}
function toggleSymptom(day,s){const f=state.period.feelings[day]||{};f.symptoms=f.symptoms||[];if(f.symptoms.includes(s))f.symptoms=f.symptoms.filter(x=>x!==s);else f.symptoms.push(s);state.period.feelings[day]=f;render();}
function savePeriodFeel(day){addEnergy(1);showHeartToast(1);saveState();showModal({title:'保存成功',body:`${day} 的经期记录已保存`,noCancel:true});}
function getLastPeriodStart(){
  const all=[...state.period.records.map(r=>r.startDate)];
  if(state.period.currentStart)all.push(state.period.currentStart);
  if(!all.length)return null;
  return all.sort().pop();
}
function avgCycleLength(){
  const recs=state.period.records.slice().sort((a,b)=>a.startDate.localeCompare(b.startDate));
  if(recs.length<2)return 28;
  let sum=0,cnt=0;
  for(let i=1;i<recs.length;i++){sum+=daysBetween(recs[i-1].startDate,recs[i].startDate);cnt++;}
  return Math.round(sum/cnt);
}
function avgPeriodLength(){
  const recs=state.period.records;
  if(!recs.length)return 5;
  const sum=recs.reduce((a,r)=>a+daysBetween(r.startDate,r.endDate)+1,0);
  return Math.round(sum/recs.length);
}
function renderPeriodStats(box){
  const card=div('card');
  const recs=state.period.records.slice().sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const last=getLastPeriodStart();
  const next=last?addDays(last,avgCycleLength()):null;
  const cycleLen=avgCycleLength();
  const periodLen=avgPeriodLength();
  const total=recs.length+(state.period.currentStart?1:0);
  card.innerHTML=`<div class="card-title">📊 周期统计</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${total}</div><div class="cap">累计记录周期</div></div>
      <div class="stat-card"><div class="num">${cycleLen}</div><div class="cap">平均周期长度（天）</div></div>
      <div class="stat-card"><div class="num">${periodLen}</div><div class="cap">平均经期长度（天）</div></div>
      <div class="stat-card"><div class="num">${last?daysBetween(last,todayKey()):'--'}</div><div class="cap">距离上次开始（天）</div></div>
    </div>
    <div class="card-title">🔮 下次预测</div>
    <div style="background:var(--cream);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;text-align:center;">
      <div style="font-size:13px;color:var(--brown-light);">预计下次来潮</div>
      <div style="font-size:22px;font-weight:800;color:var(--pink-4);margin-top:4px;">${next||'暂无足够数据'}</div>
    </div>
    <div class="card-title">📜 历史记录</div>`;
  if(!recs.length&&!state.period.currentStart)card.innerHTML+='<div class="empty-tip">还没有经期记录，去「周期日历」添加吧</div>';
  else{
    const list=div();
    if(state.period.currentStart){
      const item=div('history-item');item.innerHTML=`<div class="history-dot" style="background:var(--pink-4)"></div><div class="history-body"><b>进行中：${state.period.currentStart} 至今</b><p>尚未结束</p></div>`;list.appendChild(item);
    }
    recs.slice().reverse().forEach(r=>{const item=div('history-item');item.innerHTML=`<div class="history-dot"></div><div class="history-body"><b>${r.startDate} ~ ${r.endDate}</b><p>持续 ${daysBetween(r.startDate,r.endDate)+1} 天</p></div>`;list.appendChild(item);});
    card.appendChild(list);
  }
  box.appendChild(card);
}

function compressImage(file,maxSize=800,quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>h&&w>maxSize){h=Math.round(h*maxSize/w);w=maxSize;}
        else if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize;}
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        const data=canvas.toDataURL('image/jpeg',quality);
        if(data.length>500*1024){
          const q=Math.max(.3,quality*(500*1024/data.length));
          resolve(canvas.toDataURL('image/jpeg',q));
        }else resolve(data);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
function updateTreeImagePreview(){
  const box=document.getElementById('treeImgPreview');if(!box)return;

// 每个 type 的 5 阶段成长序列（用 type 自带图标 + emoji 装饰突出阶段）
const PLANT_GROWTH={
  succulent:['🌵','🌵','🌵','🌵','🌵✨'],
  sunflower:['🌱','🌿','🌿','🌻','🌻✨'],
  sakura:['🌱','🌿','🌳','🌸','🌸✨'],
  blueberry:['🌱','🌿','🫐','🫐','🫐✨']
};
const PLANT_STAGES=['种子','发芽','幼苗','茁壮','开花'];
// 阶段徽章小图标（与 type 无关，通用）
const PLANT_BADGE_ICONS=['🌰','🌱','🌿','🌳','🌸'];
function plantStage(level){return PLANT_STAGES[Math.min(PLANT_STAGES.length-1,Math.max(0,level-1))];}
function plantStageIcon(level,type){
  const seq=PLANT_GROWTH[type]||['🌱','🌿','🌳','🌸','🌸'];
  return seq[Math.min(seq.length-1,Math.max(0,level-1))];
}
function plantNeedExp(level){return level*20;}
function tickGarden(silent){
  const now=Date.now();
  let changed=false;
  if(state.garden && Array.isArray(state.garden.plants)){
    state.garden.plants.forEach(p=>{
      const last=p.lastMoistureTick||now;
      const hours=(now-last)/3600000;
      if(hours>=0.01){
        const before=p.moisture??100;
        const after=Math.max(0,before-hours*2);
        if(Math.floor(before/5)!==Math.floor(after/5))changed=true;
        p.moisture=after;p.lastMoistureTick=now;
      }
    });
  }
  if(state.pet && Array.isArray(state.pet.owned)){
    state.pet.owned.forEach(p=>{
      const last=p.lastPetTick||now;
      const hours=(now-last)/3600000;
      if(hours>=0.01){
        const beforeH=p.hunger??80;
        const afterH=Math.max(0,beforeH-hours*1.5);
        const beforeHa=p.happiness??80;
        const afterHa=Math.max(0,beforeHa-hours*1);
        if(Math.floor(beforeH/10)!==Math.floor(afterH/10)||Math.floor(beforeHa/10)!==Math.floor(afterHa/10))changed=true;
        p.hunger=afterH;p.happiness=afterHa;p.lastPetTick=now;
      }
    });
  }
  if(changed && !silent)saveState();
}

function waterPlant(id,e){
  e.stopPropagation();
  if((state.game.energy||0)<10)return showModal({title:'爱心值不足',body:'完成习惯打卡可获得爱心值',noCancel:true});
  const p=state.garden.plants.find(x=>x.id===id);if(!p)return;
  const before=p.level;
  addEnergy(-10);addEnergy(1);showHeartToast(1);
  p.exp+=15;p.moisture=Math.min(100,(p.moisture??100)+25);
  p.lastWatered=Date.now();p.lastMoistureTick=Date.now();
  levelUpPlant(p);
  const rowEl=e.target.closest('.game-card');
  if(p.level>before){
    popLevelUp(rowEl);petalRain(rowEl);
  }else{
    floatEmoji(e.target,'💧',{count:4});
  }
  saveState();render();
  playActor(document.querySelector('.game-card[data-plant-id="'+id+'"]'),'do-squish',600);

function sunPlant(id,e){
  e.stopPropagation();const p=state.garden.plants.find(x=>x.id===id);if(!p)return;
  const t=todayKey();if(!p.sunLog)p.sunLog={};if((p.sunLog[t]||0)>=3)return;
  const before=p.level;
  p.exp+=5;p.sunLog[t]=(p.sunLog[t]||0)+1;
  p.moisture=Math.min(100,(p.moisture??100)+5);
  addEnergy(1);showHeartToast(1);
  levelUpPlant(p);
  const rowEl=e.target.closest('.game-card');
  if(p.level>before){
    popLevelUp(rowEl);petalRain(rowEl);
  }else{
    floatEmoji(e.target,'☀️',{count:3,dy:0});

  saveState();render();
  playActor(document.querySelector('.game-card[data-plant-id="'+id+'"]'),'do-stretch',700);

/* v45 nurture growth stages: GPT Image plant sprites + richer daily growth loop. */
function nurtureCreatedAt(item){
  return item?.createdAt || item?.id || Date.now();
}
function nurtureDays(item){
  const base=new Date(nurtureCreatedAt(item));
  base.setHours(0,0,0,0);
  const now=new Date();
  now.setHours(0,0,0,0);
  return Math.max(1,Math.floor((now-base)/86400000)+1);
}
function plantGrowthStageIndex(level){
  const lv=level||1;
  if(lv<=1)return 0;
  if(lv===2)return 1;
  if(lv<=4)return 2;
  return 3;
}
function plantStageLabel(level){
  return ['种子','幼苗','成长期','成熟期'][plantGrowthStageIndex(level)];
}
function plantStageAsset(p){
  const type=(p?.type==='sakura')?'rose':(p?.type==='clover')?'blueberry':(p?.type||'succulent');
  return `plant-${type}-stage-${plantGrowthStageIndex(p?.level)+1}-clean-v3.png`;
}
function plantCareStatus(p){
  const moisture=Math.round(p.moisture??100);
  const sunToday=(p.sunLog||{})[todayKey()]||0;
  if(moisture<35)return '有点口渴，想喝水';
  if(sunToday>=3)return '今天阳光已经满格';
  if((p.level||1)>=5)return '已经长成漂亮的大人了';
  return '正在一点点长大';
}
function petStageLabelV45(level){
  const lv=level||1;
  if(lv<=1)return '幼崽';
  if(lv<=3)return '熟悉你';
  if(lv<=5)return '黏人期';
  return '满亲密';
}
function petGrowthStageIndex(level){
  const lv=level||1;
  if(lv<=1)return 0;
  if(lv<=3)return 1;
  if(lv<=5)return 2;
  return 3;
}
function petRoomAssetV45(p){
  const type=['dog','rabbit','fox'].includes(p?.type)?p.type:'cat';
  if(type==='cat')return `pet-room-lihua-stage-${petGrowthStageIndex(p?.level)+1}-sharp.png`;
  return `pet-room-${type}-stage-${petGrowthStageIndex(p?.level)+1}.png`;

function petNurtureStatus(p,today){
  const hunger=Math.round(p.hunger??80);

  if((today.pet||0)>=5)return '今天已经被摸得很满足';

/* v57 modal cleanup: form dialogs use a close button and no duplicate footer OK. */
function showModal({title='提示',body='',input=false,inputValue='',placeholder='',noCancel=false,render=null,hideOk=false,closeButton=false,modalClass=''}){
  const ov=document.getElementById('modalOverlay');const box=document.getElementById('modalBox');
  box.className='modal'+(modalClass?` ${modalClass}`:'');
  document.getElementById('modalTitle').textContent=title;
  const bodyEl=document.getElementById('modalBody');bodyEl.innerHTML=body;
  const extra=document.getElementById('modalExtra');extra.innerHTML='';
  const acts=document.getElementById('modalActions');acts.innerHTML='';
  box.querySelectorAll('.modal-close').forEach(btn=>btn.remove());
  if(closeButton){
    const close=document.createElement('button');
    close.className='modal-close';
    close.type='button';
    close.setAttribute('aria-label','关闭');
    close.textContent='×';
    close.onclick=()=>{const r=modalResolve;hideModal();if(r)r(null);};
    box.appendChild(close);
  }
  let inputEl=null;
  if(input){inputEl=document.createElement('input');inputEl.value=inputValue;inputEl.placeholder=placeholder;extra.appendChild(inputEl);}
  if(render)render(bodyEl,extra);
  if(!hideOk){
    const okBtn=document.createElement('button');okBtn.className='ok';okBtn.textContent='确定';
    okBtn.onclick=()=>{const val=inputEl?inputEl.value.trim():true;const r=modalResolve;hideModal();if(r)r(val);};
    acts.appendChild(okBtn);
  }
  if(!noCancel){
    const cBtn=document.createElement('button');cBtn.className='cancel';cBtn.textContent='取消';
    cBtn.onclick=()=>{const r=modalResolve;hideModal();if(r)r(null);};
    acts.appendChild(cBtn);
  }
  ov.classList.add('show');if(inputEl)setTimeout(()=>inputEl.focus(),50);
  setTimeout(()=>initCustomScrollbars(),0);
  return new Promise(r=>modalResolve=r);
}
function showConfirm(body){return showModal({title:'请确认',body,noCancel:false});}
function hideModal(){
  const ov=document.getElementById('modalOverlay');const box=document.getElementById('modalBox');
  ov.classList.remove('show');box.className='modal';box.querySelectorAll('.modal-close').forEach(btn=>btn.remove());modalResolve=null;
}

/* ================= v34 选择困难症 · 扁平风转盘 ================= */
const WHEEL_COLORS=['#ff8fab','#a78bfa','#fbbf24','#34d399','#fb7185','#c084fc'];
function polarToCartesian(cx,cy,r,angleDeg){
  const a=(angleDeg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};
}
function genWheelPath(startAngle,endAngle,r){
  const s=polarToCartesian(0,0,r,endAngle);
  const e=polarToCartesian(0,0,r,startAngle);
  const largeArc=(endAngle-startAngle)<=180?0:1;
  return `M 0 0 L ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 0 ${e.x.toFixed(2)} ${e.y.toFixed(2)} Z`;
}

function ensureDiceState(){
  if(!state.dice)state.dice={opts:[]};
  if(!Array.isArray(state.dice.opts))state.dice.opts=[];
}

function renderDice(box){
  ensureDiceState();
  const opts=state.dice.opts.filter(o=>o&&o.trim());
  const n=opts.length;
  let html=`<div class="dice-page">`;
  // 空状态(初次打开 / 清空数据)
  if(n===0){
    html+=`<div class="dice-empty">
      <div class="de-ico">🎯</div>
      <div class="de-title">还没有选项</div>
      <div class="de-sub">下面输入框加 2-6 个让你纠结的事，然后转一转做决定吧～</div>
    </div>`;
    html+=`<div class="dice-add">
      <input id="diceNewOpt" placeholder="例如：火锅、烧烤、看电影..." maxlength="20" onkeydown="if(event.key==='Enter')addDiceOpt()">
      <button onclick="addDiceOpt()">+ 添加</button>
    </div>`;
    html+=`<button class="dice-roll" onclick="spinWheel()" disabled>🎯 转一转</button>`;
    html+=`<div class="dice-result" id="diceResult">先添加 2-6 个选项再转一转～</div>`;
    html+=`</div>`;
    box.innerHTML=html;
    return;
  }
  const segAngle=360/n;
  // 扁平风转盘(SVG 分块)
  html+=`<div class="wheel-stage">`;
  html+=`<div class="wheel-pointer"></div>`;
  html+=`<div class="wheel-outer"><svg class="wheel-svg" id="wheelSvg" viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<n;i++){
    // 扇区居中:segment 0 中心对准指针(顶部,角度 0)
    const startA=-segAngle/2+i*segAngle;
    const endA=startA+segAngle;
    const d=genWheelPath(startA,endA,120);
    const midAngle=i*segAngle;
    // 数字标号(扇区中点,稍偏内)
    const numR=70;
    const nx=numR*Math.cos((midAngle-90)*Math.PI/180);
    const ny=numR*Math.sin((midAngle-90)*Math.PI/180);
    html+=`<path class="wheel-seg" d="${d}" fill="${WHEEL_COLORS[i%WHEEL_COLORS.length]}"/>`;
    html+=`<text class="wheel-label" x="${nx.toFixed(2)}" y="${ny.toFixed(2)}" text-anchor="middle" dominant-baseline="central" style="font-size:16px;fill:#fff;opacity:.95;">${i+1}</text>`;
  }
  // 中心 GO 按钮
  html+=`<circle cx="0" cy="0" r="34" fill="#fff" stroke="#ff8fab" stroke-width="3"/>`;
  html+=`<text class="wheel-hub" x="0" y="2" text-anchor="middle" dominant-baseline="central">GO</text>`;
  html+=`</svg></div>`;
  html+=`</div>`;
  html+=`<div class="dice-hint">点击下方「转一转」· 转盘会选出一个</div>`;
  // 选项列表(颜色与扇区对应)
  html+=`<div class="dice-opts">`;
  opts.forEach((opt,i)=>{
    const c=WHEEL_COLORS[i%WHEEL_COLORS.length];
    html+=`<div class="dice-opt" data-idx="${i}">
      <div class="dice-num" style="background:${c};">${i+1}</div>
      <input value="${esc(opt).replace(/"/g,'&quot;')}" onchange="updateDiceOpt(${i},this.value)" onkeydown="if(event.key==='Enter')this.blur()" maxlength="20" placeholder="选项 ${i+1}">
      <button class="dice-del" onclick="delDiceOpt(${i})" title="删除">×</button>
    </div>`;
  });
  html+=`</div>`;
  if(opts.length>=6){
    html+=`<div class="dice-warn">已达上限 6 个选项</div>`;
  }else{
    html+=`<div class="dice-add">
      <input id="diceNewOpt" placeholder="添加新选项..." maxlength="20" onkeydown="if(event.key==='Enter')addDiceOpt()">
      <button onclick="addDiceOpt()" ${opts.length>=6?'disabled':''}>+ 添加</button>
    </div>`;
  }
  html+=`<button class="dice-roll" onclick="spinWheel()" ${diceRolling?'disabled':''}>🎯 转一转</button>`;
  html+=`<div class="dice-result" id="diceResult">请先添加 2-6 个纠结的选项,然后转一转做决定～</div>`;
  html+=`</div>`;
  box.innerHTML=html;
}

function updateDiceOpt(i,val){
  ensureDiceState();
  state.dice.opts[i]=val.trim();
  saveState();
  renderDice(document.getElementById('contentBox'));
}

function addDiceOpt(){
  ensureDiceState();
  const input=document.getElementById('diceNewOpt');
  if(!input)return;
  const v=input.value.trim();
  if(!v)return;
  if(state.dice.opts.length>=6)return;
  state.dice.opts.push(v);
  saveState();
  renderDice(document.getElementById('contentBox'));
}

function delDiceOpt(i){
  ensureDiceState();
  if(state.dice.opts.length===0)return;
  state.dice.opts.splice(i,1);
  saveState();
  renderDice(document.getElementById('contentBox'));
}

function spinWheel(){
  if(diceRolling)return;
  ensureDiceState();
  const opts=state.dice.opts.filter(o=>o&&o.trim());
  if(opts.length<2){
    showModal({title:'提示',body:'至少需要 2 个选项哦～',noCancel:true});
    return;
  }
  diceRolling=true;
  const wheel=document.getElementById('wheelSvg');
  const resultBox=document.getElementById('diceResult');
  document.querySelectorAll('.dice-opt').forEach(o=>o.classList.remove('selected'));
  resultBox.innerHTML='🎯 转盘正在转...';
  // 随机选一个选项
  const idx=Math.floor(Math.random()*opts.length);
  const n=opts.length;
  const segAngle=360/n;
  // 扇区 idx 中心初始角度: i*segAngle(因为 segment 0 居中在顶部)
  // 指针固定在顶部(角度 0)
  // 要让扇区 idx 转到指针处,需旋转 -(idx)*segAngle
  // 加 N 圈随机正向旋转
  const baseTurns=5+Math.floor(Math.random()*2);
  const finalRot=baseTurns*360-idx*segAngle;
  wheel.style.transform=`rotate(${finalRot}deg)`;
  // 4s 后:落地,选选项,撒花
  setTimeout(()=>{
    const picked=opts[idx];
    resultBox.innerHTML=`🎉 转盘选中:选 <b>${esc(picked)}</b> 吧!`;
    const optEls=document.querySelectorAll('.dice-opt');
    if(optEls[idx])optEls[idx].classList.add('selected');
    petalRain(24);
    showHeartToast(2);
    diceRolling=false;
  },4100);
}

function waterPlant(id,e){
  e?.stopPropagation?.();

  const p=state.garden.plants.find(x=>x.id===id);if(!p)return;
  const before=p.level;
  addEnergy(-2);
  p.exp+=15;p.moisture=Math.min(100,(p.moisture??100)+28);
  p.lastWatered=Date.now();p.lastMoistureTick=Date.now();
  levelUpPlant(p);
  saveState();render();
  setTimeout(()=>{
    triggerPlantMotion(id,p.level>before?'is-grown':'is-watered');
    sprinkleGardenBits(id,'water');
    if(p.level>before){popLevelUp(getPlantSlot(id));petalRain(getPlantSlot(id));}
  },30);
}

function petWearKey(p){
  const decor=p?.decor||{};
  const type=['cat','dog','rabbit','fox'].includes(p?.type)?p.type:'cat';
  const hasCrown=decor.head==='crown-gold';
  const collarMap={'bow-pink':'bow','collar-heart':'heart','collar-bell':'bell'};
  const collar=collarMap[decor.collar]||'';
  if(type==='cat'){
    if(hasCrown&&collar)return `crown-${collar}`;
    if(hasCrown)return 'crown';
    if(collar)return collar;
    return '';
  }
  if(collar)return collar;
  if(hasCrown)return 'crown';
  return '';
}

    <button class="pixel-action" onclick="petPet(${p.id},event)" ${(today.pet||0)>=5?'disabled':''}>🤗 抚摸<small>今日 ${today.pet||0}/5 · +2</small></button>
    <button class="pixel-action" onclick="playPet(${p.id},event)"${(today.play||0)>=3?' disabled':''}>🧶 陪玩<small>今日 ${today.play||0}/3 · +2</small></button>
  </div>`;
  box.appendChild(card);
  setTimeout(()=>schedulePetIdle(p.id),60);
}

function ensurePetShopV70(){
  const additions=[
    {id:'lace-blue',name:'蓝白钩织围脖',cat:'collar',price:18,img:'shop-lace-blue.png'},
    {id:'lace-pink',name:'粉白钩织围脖',cat:'collar',price:20,img:'shop-lace-pink.png'}
  ];
  additions.forEach(item=>{
    if(!PET_SHOP_ITEMS.some(x=>x.id===item.id))PET_SHOP_ITEMS.push(item);
  });
}
function petWearKey(p){
  const decor=p?.decor||{};
  const type=['cat','dog','rabbit','fox'].includes(p?.type)?p.type:'cat';
  const hasCrown=decor.head==='crown-gold';
  const collarMap={
    'bow-pink':'bow',
    'collar-heart':'heart',
    'collar-bell':'bell',
    'lace-blue':'lace-blue',
    'lace-pink':'lace-pink'
  };
  const collar=collarMap[decor.collar]||'';
  if(type==='cat'){
    if(hasCrown&&['bow','heart','bell','lace-blue','lace-pink'].includes(collar))return `crown-${collar}`;
    if(collar)return collar;
    if(hasCrown)return 'crown';
    return '';
  }
  if(collar)return collar;
  if(hasCrown)return 'crown';
  return '';
}
function openPetShop(petId){
  ensurePetShopV70();
  ensureNurtureEconomy();
  const p=(state.pet.owned||[]).find(x=>x.id===petId);
  if(!p)return;
  if(!p.decor)p.decor={};
  const body=div('pet-shop-grid');
  PET_SHOP_ITEMS.forEach(item=>{
    const owned=state.shop.owned.includes(item.id);
    const equipped=p.decor[item.cat]===item.id;
    const card=div('pet-shop-card');
    const action=owned
      ? `<button class="${equipped?'':'primary'}" onclick="${equipped?`unequipPetDecor(${p.id},'${item.cat}')`:`equipPetDecor(${p.id},'${item.id}')`}">${equipped?'卸下':'装备'}</button>`
      : `<button class="primary" onclick="buyPetDecor(${p.id},'${item.id}')" ${(state.game.energy||0)<item.price?'disabled':''}>购买 ${item.price} 爱心</button>`;
    const catText={head:'头饰',collar:'项圈/围脖',toy:'玩具',room:'房间装饰'}[item.cat]||'装饰';
    card.innerHTML=`<img src="./generated-images/${item.img}?v=80" alt="${esc(item.name)}" onerror="this.outerHTML='<span class=&quot;shop-img-fallback&quot;>🎀</span>'"><div><b>${esc(item.name)}</b><small>${catText} · ${owned?'已拥有':'未拥有'}</small>${action}</div>`;
    body.appendChild(card);
  });
  showModal({title:'🛍️ 宠物商店',body:'',noCancel:true,hideOk:true,closeButton:true,modalClass:'form-modal pet-shop-modal',render:m=>m.appendChild(body)});
}
function buyPetDecor(petId,itemId){
  ensurePetShopV70();
  ensureNurtureEconomy();
  const item=PET_SHOP_ITEMS.find(x=>x.id===itemId);
  const p=(state.pet.owned||[]).find(x=>x.id===petId);
  if(!item||!p)return;
  if(state.shop.owned.includes(itemId))return equipPetDecor(petId,itemId);
  if((state.game.energy||0)<item.price)return showModal({title:'爱心值不足',body:'完成任务、晒太阳、摸摸或陪玩都可以获得爱心值，攒够再来买吧。',noCancel:true});
  addEnergy(-item.price);
  state.shop.owned.push(itemId);
  if(!p.decor)p.decor={};
  p.decor[item.cat]=itemId;
  saveState();
  hideModal();
  render();
  setTimeout(()=>openPetShop(petId),30);
}
function equipPetDecor(petId,itemId){
  ensurePetShopV70();
  const item=PET_SHOP_ITEMS.find(x=>x.id===itemId);
  const p=(state.pet.owned||[]).find(x=>x.id===petId);
  if(!item||!p)return;
  if(!p.decor)p.decor={};
  p.decor[item.cat]=itemId;
  saveState();
  hideModal();
  render();
  setTimeout(()=>openPetShop(petId),30);
}
ensurePetShopV70();

function petActionSpriteAssetV71(p,action='idle'){
  const type=['cat','dog','rabbit','fox'].includes(p?.type)?p.type:'cat';
  const key=petWearKey(p);
  const actionMap={blink:'blink',tail:'tail',happy:'happy'};
  const catAnimatedWearKeys=['lace-blue','lace-pink','bow','heart','bell','crown'];
  if(type==='cat'&&catAnimatedWearKeys.includes(key)&&actionMap[action]){
    return `pet-cat-anim-${key}-${actionMap[action]}-v4.png`;
  }
  if(key)return petOutfitSpriteAsset(p,'idle');
  return petSpriteAsset(type,action);
}
function playPetSpriteAction(id,action='idle',cls=''){
  const sprite=getPetSprite(id);
  if(!sprite)return;
  const pet=(state.pet.owned||[]).find(x=>x.id===id);
  const kind=sprite.dataset.petKind||pet?.type||'cat';
  const dressed=!!(pet&&petWearKey(pet));
  sprite.src=`./generated-images/${pet?petActionSpriteAssetV71(pet,action):petSpriteAsset(kind,action)}`;
  sprite.classList.remove('is-blink','is-tail','is-happy','is-jump','is-feed','is-dressed-action');
  if(cls){
    void sprite.offsetWidth;
    if(dressed)sprite.classList.add('is-dressed-action');
    sprite.classList.add(cls);
    setTimeout(()=>sprite.classList.remove(cls,'is-dressed-action'),1000);
  }
  clearTimeout(sprite._idleReset);
  sprite._idleReset=setTimeout(()=>{
    sprite.src=`./generated-images/${pet?petOutfitSpriteAsset(pet,'idle'):petSpriteAsset(kind,'idle')}`;
    sprite.classList.remove('is-blink','is-tail','is-happy','is-jump','is-feed','is-dressed-action');
  },1120);
}

render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
