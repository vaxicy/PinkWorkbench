<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff8fab" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="工作台" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=7" />
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=7" />
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=7" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=7" />
<title>工作台</title>
<style>
  :root{
    --bg:#fff5f7;--bg-dot:#ffe3eb;--panel:#fff7f9;--cream:#fff0f3;--surface:#ffffff;--english-card:#fff8fa;--english-accent:var(--pink-4);
    --pink-1:#ffd6e0;--pink-2:#ffb3c6;--pink-3:#ff8fab;--pink-4:#ff7096;
    --brown:#8a6268;--brown-light:#b39299;--green:#7cc09c;--blue:#8ecae6;--purple:#c9a0dc;
    --shadow:0 6px 18px rgba(255,143,171,.15);
    --radius-lg:24px;--radius:16px;--radius-sm:12px;
    --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  *::-webkit-scrollbar-button{display:none;width:0;height:0;}
  body{font-family:var(--font);color:var(--brown);background:var(--bg);
    background-image:radial-gradient(circle at 12px 12px,var(--bg-dot) 2.5px,transparent 3px);background-size:22px 22px;
    height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;}
  .app{width:100%;max-width:1080px;height:calc(100vh - 48px);background:var(--surface);border-radius:var(--radius-lg);
    box-shadow:0 18px 50px rgba(255,143,171,.22);display:flex;overflow:hidden;border:1px solid var(--pink-1);}

  /* 侧边栏 */
  .sidebar{width:130px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--pink-1);box-shadow:2px 0 12px rgba(255,143,171,.12);
    border-right:1px solid var(--pink-1);padding:18px 10px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
  .nav-divider{height:1px;background:linear-gradient(90deg,transparent,var(--pink-1),transparent);margin:4px 8px;flex-shrink:0;}
  .profile{text-align:center;position:relative;}
  .avatar-wrap{position:relative;width:64px;height:64px;margin:0 auto 8px;cursor:pointer;-webkit-tap-highlight-color:rgba(255,143,171,.15);}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--pink-2),var(--pink-3));
    display:grid;place-items:center;font-size:34px;box-shadow:0 4px 12px rgba(255,143,171,.28);border:2px solid var(--surface);overflow:hidden;pointer-events:none;}
  .avatar img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
  .avatar-hint{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;background:var(--pink-3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;text-align:center;box-shadow:var(--shadow);cursor:pointer;border:2px solid var(--surface);transition:transform .2s,background .2s;}.avatar-hint:hover{transform:scale(1.1);background:var(--pink-4);}
  .avatar-hint svg{display:block;transform:translateY(-1px);}
  .profile .name{font-size:12px;font-weight:700;color:var(--brown);padding:6px 8px;border-radius:8px;cursor:pointer;min-height:28px;display:inline-block;line-height:1.4;-webkit-tap-highlight-color:rgba(255,143,171,.2);}
  .profile .name:hover{background:var(--pink-1);}
  .profile input{width:110px;text-align:center;border:1px solid var(--pink-3);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;color:var(--brown);outline:none;box-sizing:border-box;font-family:inherit;}

  nav{display:flex;flex-direction:column;gap:6px;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 3px;border-radius:var(--radius);border:none;background:transparent;
    color:var(--brown-light);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:.2s;}
  .nav-item .ico{font-size:20px;}
  .nav-item:hover{background:var(--cream);}
  .nav-item.active{background:linear-gradient(135deg,var(--pink-3),var(--pink-4));color:var(--surface);box-shadow:var(--shadow);}

  .backup-bar{margin-top:auto;padding-top:10px;border-top:1px dashed var(--pink-1);display:flex;flex-direction:column;gap:6px;}
  .backup-bar button{border:1px solid var(--pink-1);background:var(--surface);border-radius:999px;padding:6px 4px;font-size:10px;font-weight:700;color:var(--brown-light);cursor:pointer;}
  .backup-bar button:hover{background:var(--cream);color:var(--pink-4);}
  .backup-bar button.tutorial-btn{background:linear-gradient(135deg,var(--pink-3),var(--pink-4));color:var(--surface);border:none;font-weight:800;}
  .backup-bar button.tutorial-btn:hover{background:linear-gradient(135deg,var(--pink-3),var(--pink-4));color:var(--surface);filter:brightness(1.06);}
  .tutorial h4{margin:16px 0 6px;font-size:14px;color:var(--pink-4);}
  .tutorial h4:first-of-type{margin-top:0;}
  .tutorial ol{margin:0 0 4px;padding-left:20px;}
  .tutorial ol li{margin:5px 0;font-size:13px;color:var(--brown);}
  .tutorial code{background:var(--cream);padding:1px 6px;border-radius:5px;font-size:12px;color:var(--pink-4);}
  .tutorial .tut-tip{background:var(--cream);border-left:3px solid var(--pink-3);padding:8px 10px;border-radius:8px;font-size:12px;color:var(--brown);margin:10px 0 0;}
  .memo-item{background:var(--cream);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
  .memo-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .memo-head b{color:var(--pink-4);}
  .memo-time{font-size:11px;color:var(--brown-light);}
  .memo-body{margin:6px 0;white-space:pre-wrap;word-break:break-word;color:var(--brown);font-size:13px;}
  .memo-textarea{width:100%;border:1px solid var(--pink-2);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;resize:vertical;box-sizing:border-box;}
  .shop-list,.shop-bought{display:flex;flex-direction:column;gap:6px;}
  .shop-item{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:var(--radius-sm);padding:8px 10px;}
  .shop-item.bought{opacity:.7;}
  .shop-check{flex:0 0 auto;display:flex;align-items:center;}
  .shop-check input{width:18px;height:18px;accent-color:var(--pink-3);cursor:pointer;}
  .shop-check.done{width:20px;height:20px;border-radius:6px;background:var(--green);color:var(--surface);align-items:center;justify-content:center;font-weight:800;font-size:12px;}
  .shop-info{flex:1;min-width:0;}
  .shop-info b{color:var(--pink-4);}
  .shop-cat{display:block;font-size:11px;color:var(--brown-light);margin-top:2px;}
  .shop-amt{font-weight:800;color:var(--pink-4);}
  .shop-item button{margin-left:auto;}

  /* 主内容 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  .topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--pink-1);display:flex;align-items:center;justify-content:center;position:relative;padding:0 22px;}
  .topbar-center{display:flex;align-items:center;gap:10px;justify-content:center;flex:1;min-width:0;}
  .topbar .title{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;color:var(--pink-4);}
  .topbar .title .ico{font-size:24px;}
  .topbar .sub{font-size:12px;color:var(--brown-light);margin-left:6px;font-weight:600;letter-spacing:.5px;padding:2px 8px;background:linear-gradient(135deg,var(--pink-1),#fff0f3);border-radius:999px;display:none;}
  .topbar.has-sub .sub{display:inline-block;}
  .date-chip{background:var(--cream);border:1px solid var(--pink-1);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--pink-3);}
  .content{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 28px;position:relative;scrollbar-width:none;-ms-overflow-style:none;}
  .content::-webkit-scrollbar{display:none;width:0;height:0;background:transparent;}
  body::-webkit-scrollbar{display:none;width:0;background:transparent;}
  .topbar-tabs{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;}
  .topbar-tab{padding:8px 18px;border-radius:999px;border:1px solid var(--pink-1);background:var(--surface);color:var(--brown);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:1px;white-space:nowrap;flex:0 1 auto;}
  .topbar-tab:hover{background:var(--pink-1);}
  .topbar-tab.on{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(236,72,153,.3);transform:translateY(-1px);}
  .page{display:none;animation:fade .25s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:8px 16px;border-radius:999px;border:none;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--brown-light);border:1px solid var(--pink-1);transition:.2s;}
  .tab.active{background:linear-gradient(135deg,var(--pink-3),var(--pink-4));color:var(--surface);border-color:transparent;box-shadow:var(--shadow);}

  .card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--pink-1);margin-bottom:16px;}
  .card-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--pink-4);position:relative;}
  .set-gear{margin-left:auto;font-size:14px;opacity:.55;cursor:pointer;transition:opacity .2s;filter:grayscale(.2);}
  .set-gear:hover{opacity:1;}
  .card-sub{font-size:12px;color:var(--brown-light);margin-bottom:14px;}

  .toggle{display:inline-flex;background:var(--cream);border-radius:999px;padding:4px;margin-bottom:14px;flex-wrap:wrap;}
  .toggle button{border:none;background:transparent;padding:7px 14px;border-radius:999px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--brown-light);cursor:pointer;white-space:nowrap;}
  .toggle button.on{background:var(--surface);color:var(--pink-4);box-shadow:0 2px 8px rgba(255,143,171,.15);}

  /* 任务项 */
  .task{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--radius-sm);background:var(--cream);margin-bottom:10px;transition:.2s;border:1px solid transparent;position:relative;}
  .task:hover{border-color:var(--pink-1);}
  .task .check{width:24px;height:24px;border-radius:8px;border:2px solid var(--pink-2);background:var(--surface);flex-shrink:0;display:grid;place-items:center;transition:.2s;cursor:pointer;}
  .task.done .check{background:var(--pink-4);border-color:var(--pink-4);}
  .task.done .check::after{content:"✓";color:var(--surface);font-size:14px;font-weight:800;}
  .task .info{flex:1;min-width:0;}
  .task .info b{display:block;font-size:14px;font-weight:700;color:var(--brown);margin-bottom:2px;}
  .task .info span{font-size:12px;color:var(--brown-light);}
  .task .time{font-size:12px;color:var(--pink-3);font-weight:700;flex-shrink:0;}
  .task.done b,.task.done span{color:var(--brown-light);text-decoration:line-through;}
  .task-actions{display:flex;gap:6px;opacity:0;transition:.2s;position:relative;z-index:25;}
  .task:hover .task-actions{opacity:1;}
  .task-actions button{width:26px;height:26px;border-radius:8px;border:1px solid var(--pink-1);background:var(--surface);cursor:pointer;font-size:13px;display:grid;place-items:center;color:var(--brown-light);}
  .task-actions button:hover{background:var(--pink-1);color:var(--pink-4);}

  /* 习惯打卡 */
  .habit-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--pink-0);border-radius:var(--radius-sm);font-size:13px;color:var(--brown-light);}
  .habit-summary span{display:flex;align-items:center;gap:4px;}
  .habit-summary b{color:var(--pink-4);font-size:14px;}
  .habit-row .check.on{background:var(--green);border-color:var(--green);}
  .habit-row .check.on::after{content:"✓";color:var(--surface);font-size:14px;font-weight:800;}
  .task.habit-row.done b,.task.habit-row.done span{text-decoration:none;color:var(--brown);}
  .week-dots{display:flex;gap:5px;margin-top:6px;}
  .week-dots .dot{width:14px;height:14px;border-radius:50%;background:var(--pink-1);flex:0 0 auto;}
  .week-dots .dot.on{background:var(--green);}
  .habit-cat{display:inline-block;padding:2px 8px;background:var(--pink-1);color:var(--pink-4);border-radius:999px;font-size:11px;}
  .habit-counter{display:flex;align-items:center;gap:8px;}
  .habit-counter button{width:28px;height:28px;border-radius:50%;border:1px solid var(--pink-2);background:var(--surface);color:var(--pink-4);font-weight:800;cursor:pointer;display:grid;place-items:center;}
  .habit-counter button:hover{background:var(--pink-1);}
  .habit-counter span{font-size:13px;color:var(--brown);font-weight:700;min-width:60px;text-align:center;}
  .habit-type-row{display:flex;gap:8px;margin-bottom:12px;}
  .habit-type-btn{flex:1;padding:8px;border:1px solid var(--pink-1);border-radius:999px;background:var(--surface);color:var(--brown-light);font-family:var(--font);font-size:13px;cursor:pointer;}
  .habit-type-btn.active{background:var(--pink-1);color:var(--pink-4);border-color:var(--pink-2);font-weight:700;}
  .habit-count-row{display:flex;gap:10px;align-items:center;}
  .habit-count-row input{flex:0 0 auto;}

  /* 小树洞游戏化 */
  .tree-energy-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 14px;background:linear-gradient(90deg,var(--pink-0),var(--pink-1));border-radius:var(--radius-sm);font-size:13px;color:var(--brown);}
  .tree-energy-bar span:first-child{font-weight:800;color:var(--pink-4);font-size:15px;}
  .energy-link{color:var(--pink-4);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:700;}
  .energy-link:hover{color:var(--pink-3);}
  .energy-guide{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .energy-guide .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--cream);border-radius:var(--radius-sm);font-size:13px;color:var(--brown);}
  .energy-guide .row b{color:var(--pink-4);font-weight:800;flex:none;}
  .tree-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tree-tab{flex:1;padding:10px;border:1px solid var(--pink-1);border-radius:999px;background:var(--surface);color:var(--brown-light);font-family:var(--font);font-size:13px;cursor:pointer;}
  .tree-tab.on{background:var(--pink-1);color:var(--pink-4);border-color:var(--pink-2);font-weight:700;}
  /* ---------- 花园/宠物 · 游戏化卡片 ---------- */
  .game-card{
    display:flex;align-items:stretch;gap:14px;padding:14px;
    background:linear-gradient(135deg,var(--pink-0) 0%,var(--cream) 100%);
    border-radius:18px;margin-bottom:10px;
    box-shadow:0 4px 14px rgba(255,143,170,.12),inset 0 1px 0 #fff;
    position:relative;overflow:visible;
    border:1.5px solid var(--pink-1);
    transition:transform .25s,box-shadow .25s;
  }
  .game-card::before{
    content:'';position:absolute;top:0;left:8px;right:8px;height:3px;
    background:linear-gradient(90deg,transparent,var(--pink-3),transparent);
    border-radius:0 0 4px 4px;opacity:.7;
  }
  .game-card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,143,170,.2);}
  .game-card.levelup{animation:levelPop 1s cubic-bezier(.34,1.56,.64,1);}
  @keyframes levelPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.07);box-shadow:0 0 0 8px rgba(255,202,209,.6),0 10px 30px rgba(255,143,170,.35);}
    70%{transform:scale(.98);}
    100%{transform:scale(1);box-shadow:0 4px 14px rgba(255,143,170,.12);}
  }
  .game-card.stage-final{background:linear-gradient(135deg,#fff0f5,#ffe5ec 60%,#ffd6e7);border-color:#ffb3c6;}
  .game-card.stage-final::before{background:linear-gradient(90deg,transparent,#ff8fab,transparent);}

  .game-avatar-wrap{
    position:relative;
    align-self:center;
    width:76px;height:90px;
    flex:none;
    overflow:visible;
    perspective:600px;
  }
  /* 植物：emoji 底端伸入花盆被遮（76px zone 与 26px pot 重叠 12px，植物像扎根在土里） */
  .game-avatar-wrap.is-plant .game-avatar-zone{
    position:absolute;top:0;left:0;right:0;height:76px;
    display:flex;align-items:flex-end;justify-content:center;
    z-index:2;overflow:visible;pointer-events:none;
    transform-style:preserve-3d;
  }
  /* 宠物：emoji 底端正好坐在垫子上（72px zone 与 18px cushion 无重叠，pet 完整可见） */
  /* 宠物：emoji 居中独立展示，干净清爽 */
  .game-avatar-wrap.is-pet .game-avatar-zone{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    z-index:2;overflow:visible;pointer-events:none;
    transform-style:preserve-3d;
  }
  .game-avatar{
    font-size:48px;line-height:1;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));
    animation:sway 3.8s ease-in-out infinite;
    transform-origin:50% 95%;
    margin-bottom:0;
  }
  @keyframes sway{
    0%,100%{transform:rotate(-2deg) translateY(0);}
    50%{transform:rotate(2deg) translateY(-1px);}
  }
  .game-avatar.idle-pet{animation:petIdle 3.2s ease-in-out infinite;transform-origin:50% 90%;}
  @keyframes petIdle{
    0%,100%{transform:scaleY(1) rotateY(0deg);}
    50%{transform:scaleY(1.05) rotateY(8deg);}
  }
  /* 3D 倾斜容器 + 挤压拉伸触发层 */
  .game-tilt{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    will-change:transform;
  }
  .game-actor{
    transform-origin:50% 100%;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .game-actor.do-squish{animation:plantSquish .6s cubic-bezier(.34,1.56,.64,1);}
  .game-actor.do-stretch{animation:plantStretch .7s cubic-bezier(.34,1.56,.64,1);}
  .game-actor.do-jump{animation:petJump .75s cubic-bezier(.34,1.56,.64,1);}
  .game-actor.do-wobble{animation:petWobble .55s cubic-bezier(.34,1.56,.64,1) 2;}
  @keyframes plantSquish{
    0%{transform:scale(1,1);}
    30%{transform:scale(1.22,.78);}
    55%{transform:scale(.9,1.12);}
    75%{transform:scale(1.06,.95);}
    100%{transform:scale(1,1);}
  }
  @keyframes plantStretch{
    0%{transform:scale(1,1) translateY(0);}
    30%{transform:scale(.88,1.18) translateY(-8px);}
    55%{transform:scale(1.1,.9) translateY(0);}
    80%{transform:scale(.96,1.05) translateY(-3px);}
    100%{transform:scale(1,1) translateY(0);}
  }
  @keyframes petJump{
    0%{transform:translateY(0) scale(1,1);}
    20%{transform:translateY(0) scale(1.25,.72);}
    45%{transform:translateY(-20px) scale(.88,1.18);}
    68%{transform:translateY(0) scale(1.18,.8);}
    84%{transform:translateY(-5px) scale(.95,1.06);}
    100%{transform:translateY(0) scale(1,1);}
  }
  @keyframes petWobble{
    0%,100%{transform:rotateZ(0) scale(1,1);}
    25%{transform:rotateZ(-7deg) scale(1.08,.92);}
    75%{transform:rotateZ(7deg) scale(1.08,.92);}
  }
  .game-avatar.idle-pet.hungry{animation:petShake .5s ease-in-out infinite;}
  @keyframes petShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-2px) rotate(-3deg);}
    75%{transform:translateX(2px) rotate(3deg);}
  }
  .game-pot{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:66px;height:26px;
    background:linear-gradient(180deg,#d4956b,#a06a3f);
    border-radius:4px 4px 12px 12px;
    box-shadow:inset 0 -3px 4px rgba(0,0,0,.22),0 3px 6px rgba(160,106,63,.3);
    z-index:3;
  }
  .game-pot::before{
    content:'';position:absolute;top:-3px;left:-5px;right:-5px;height:6px;
    background:linear-gradient(180deg,#c0825e,#9a5e36);
    border-radius:3px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
    z-index:4;
  }

  .game-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}

  .record{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--pink-1);font-size:13px;}
  .record:last-child{border-bottom:none;}
  .record .amount{font-weight:800;}
  .record.income .amount{color:var(--green);}
  .record.expense .amount{color:var(--pink-4);}
  .record .note{color:var(--brown-light);font-size:11px;}
  .empty-tip{text-align:center;color:var(--brown-light);font-size:13px;padding:24px 0;}
  .confetti{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:9999;animation:confettiPop .9s ease-out forwards;}
  @keyframes confettiPop{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0;}}

  /* 图表 */
  .sport-chart-wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:center;}
  .bar-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:150px;padding:10px 0;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-track{width:100%;height:110px;background:var(--cream);border-radius:999px 999px 0 0;position:relative;overflow:hidden;}
  .bar-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--pink-2),var(--pink-4));border-radius:999px 999px 0 0;transition:height .4s ease;}
  .bar-val{font-size:10px;font-weight:800;color:var(--pink-4);}
  .bar-label{font-size:11px;color:var(--brown-light);}
  .ring-wrap{width:120px;height:120px;margin:0 auto;position:relative;}
  .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-text .big{font-size:24px;font-weight:800;color:var(--pink-4);}
  .ring-text .small{font-size:11px;color:var(--brown-light);}
  .ring-stat{text-align:center;margin-top:10px;font-size:12px;color:var(--brown-light);}
  .ring-stat b{color:var(--pink-4);font-size:16px;}

  /* 日历 */
  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cal-nav b{font-size:18px;color:var(--brown);}
  .cal-nav button{width:28px;height:28px;border-radius:50%;border:1px solid var(--pink-1);background:var(--surface);color:var(--pink-4);cursor:pointer;}
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--brown-light);margin-bottom:8px;}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
  .day{width:34px;height:34px;line-height:34px;border-radius:50%;font-size:13px;font-weight:700;margin:0 auto;cursor:pointer;transition:.2s;position:relative;background:transparent;}
  .day:hover{background:var(--cream);}
  .day.selected{box-shadow:0 0 0 2px var(--pink-4) inset;}
  .day.period{background:var(--pink-4);color:var(--surface);}
  .day.predict{background:#fff0f5;color:var(--pink-4);border:1px dashed var(--pink-3);}
  .day.ovu{background:var(--blue);color:var(--surface);}
  .day.today{box-shadow:0 0 0 2px var(--pink-3);}
  .day .emoji{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:10px;line-height:1;}
  .legend{display:flex;gap:12px;margin-top:14px;font-size:12px;justify-content:center;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;color:var(--brown-light);}
  .legend i{width:10px;height:10px;border-radius:50%;}

  /* 经期记录 */
  .period-header{margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--pink-1);}
  .feel-section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed var(--pink-1);}
  .feel-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .feel-label{font-size:13px;font-weight:700;color:var(--brown);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .feel-content{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .mood-row{display:flex;gap:10px;flex-wrap:wrap;}
  .mood-btn{width:42px;height:42px;border-radius:50%;border:2px solid transparent;background:var(--cream);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;line-height:1;}
  .mood-btn.on{border-color:var(--pink-4);background:var(--surface);}
  .sym-tags{display:flex;gap:10px;flex-wrap:wrap;}
  .sym-tag{padding:7px 14px;border-radius:999px;border:1px solid var(--pink-1);background:var(--surface);font-size:12px;color:var(--brown-light);cursor:pointer;transition:.2s;}
  .sym-tag.on{background:var(--pink-3);color:var(--surface);border-color:var(--pink-3);}
  .slider-row{display:flex;align-items:center;gap:12px;}
  .slider{flex:1;-webkit-appearance:none;height:10px;border-radius:999px;background:var(--cream);outline:none;border:1px solid var(--pink-1);}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--pink-4);cursor:pointer;border:2px solid var(--surface);box-shadow:var(--shadow);}
  .slider-val{font-size:13px;font-weight:800;color:var(--pink-4);min-width:24px;text-align:right;}
  .color-circles{display:flex;gap:10px;flex-wrap:wrap;}
  .circle-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .color-c{width:30px;height:30px;border-radius:50%;border:3px solid transparent;transition:.2s;}
  .color-c.on{border-color:var(--pink-4);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pink-2);}
  .circle-label{font-size:11px;color:var(--brown-light);}

  /* 周期统计 */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--cream);border-radius:var(--radius-sm);padding:14px;text-align:center;border:1px solid var(--pink-1);}
  .stat-card .num{font-size:24px;font-weight:800;color:var(--pink-4);}
  .stat-card .cap{font-size:11px;color:var(--brown-light);margin-top:4px;}
  .history-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--pink-1);}
  .history-item:last-child{border-bottom:none;}
  .history-dot{width:10px;height:10px;border-radius:50%;background:var(--pink-4);margin-top:5px;flex-shrink:0;}
  .history-body{flex:1;}
  .history-body b{font-size:14px;}
  .history-body p{font-size:12px;color:var(--brown-light);margin-top:2px;}

  /* 树洞 */
  .entry{padding:14px;border-radius:var(--radius-sm);background:var(--cream);margin-bottom:12px;position:relative;}
  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .entry-date{font-size:11px;color:var(--brown-light);}
  .entry .mood{font-size:12px;background:var(--surface);padding:3px 9px;border-radius:999px;color:var(--brown-light);border:1px solid var(--pink-1);}
  .entry .text{font-size:13px;line-height:1.7;color:var(--brown);white-space:pre-wrap;}
  .entry-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;position:relative;z-index:25;}
  .entry-actions button{width:26px;height:26px;border-radius:6px;border:1px solid var(--pink-1);background:var(--surface);cursor:pointer;font-size:12px;color:var(--brown-light);}
  .entry-actions button:hover{background:var(--pink-1);color:var(--pink-4);}
  .journal-box{width:100%;min-height:120px;border:1px dashed var(--pink-2);border-radius:var(--radius);background:var(--cream);padding:14px;font-family:var(--font);font-size:14px;line-height:1.7;color:var(--brown);resize:vertical;outline:none;}
  .tree-image-wrap{margin:10px 0;}
  .tree-image-add{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px dashed var(--pink-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--brown-light);font-size:12px;cursor:pointer;transition:.2s;}
  .tree-image-add:hover{border-color:var(--pink-3);color:var(--pink-3);}
  .tree-image-preview{position:relative;display:inline-block;margin-top:10px;max-width:180px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--pink-1);}
  .tree-image-preview img{display:block;width:100%;height:auto;}
  .tree-image-preview .del-img{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--pink-1);color:var(--brown-light);font-size:12px;cursor:pointer;display:grid;place-items:center;}
  .entry-img{max-width:160px;border-radius:var(--radius-sm);margin-top:10px;border:1px solid var(--pink-1);cursor:pointer;}
  .mood-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
  .mood-btns button{border:1px solid var(--pink-1);background:var(--surface);border-radius:var(--radius-sm);padding:10px 4px;font-size:12px;font-weight:700;color:var(--brown-light);cursor:pointer;text-align:center;}
  .mood-btns button.on{background:var(--pink-3);color:var(--surface);border-color:var(--pink-3);}

  .inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .inline-form input{flex:1;min-width:80px;padding:8px 10px;border:1px solid var(--pink-1);border-radius:8px;font-size:13px;outline:none;}
  .inline-form input:focus{border-color:var(--pink-3);}

  /* 分类管理 */
  .cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .cat-chip{padding:6px 12px;border-radius:999px;border:1px solid var(--pink-1);background:var(--surface);font-size:12px;font-weight:700;color:var(--brown-light);cursor:pointer;display:flex;align-items:center;gap:4px;}
  .cat-chip.on{background:var(--pink-3);color:var(--surface);border-color:var(--pink-3);}
  .cat-chip .del{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;}
  .cat-chip .del:hover{background:rgba(255,255,255,.3);}

  /* 自定义选择器 */
  .custom-select{position:relative;}
  .select-trigger{width:100%;padding:11px 14px;border:1px solid var(--pink-1);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--brown);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .select-trigger::after{content:"▼";font-size:10px;color:var(--pink-3);}
  .select-options{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--pink-1);border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:20;max-height:200px;overflow-y:auto;}
  .select-options.show{display:block;}
  .select-option{padding:10px 14px;font-size:13px;color:var(--brown);cursor:pointer;}
  .select-option:hover{background:var(--cream);}
  .select-option.on{background:var(--pink-3);color:var(--surface);}

  /* 自定义时间选择器 */
  .time-picker-wrap{position:relative;flex:1;}
  .time-display{width:100%;padding:11px 14px;border:1px solid var(--pink-1);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--brown);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .time-display::after{content:"🕐";font-size:14px;color:var(--pink-3);}
  .time-modal-overlay{display:none;position:fixed;inset:0;background:rgba(138,98,104,.35);z-index:110;justify-content:center;align-items:center;padding:20px;}
  .time-modal-overlay.show{display:flex;}
  .time-pop{position:relative;top:auto;left:auto;width:260px;background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:0 18px 50px rgba(255,143,171,.35);border:1px solid var(--pink-1);animation:modalIn .2s ease;}
  .time-pop-title{font-size:14px;font-weight:800;color:var(--brown);margin-bottom:14px;text-align:center;}
  .time-columns{display:flex;gap:12px;height:180px;}
  .time-col{flex:1;overflow-y:auto;border:1px solid var(--pink-1);border-radius:var(--radius-sm);position:relative;scrollbar-width:none;-ms-overflow-style:none;}
  .time-col::-webkit-scrollbar{display:none;width:0;height:0;}
  .time-col div{padding:10px 16px 10px 10px;text-align:center;font-size:14px;color:var(--brown);cursor:pointer;}
  .time-col div:hover{background:var(--cream);}
  .time-col div.on{background:var(--pink-3);color:var(--surface);}
  .time-actions{display:flex;gap:10px;margin-top:14px;}
  .time-actions button{flex:1;border:none;border-radius:999px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;}
  .time-actions .confirm{background:linear-gradient(135deg,var(--pink-3),var(--pink-4));color:var(--surface);}
  .time-actions .cancel{background:var(--cream);color:var(--brown);}

  /* Toggle 开关 */
  .switch-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .switch-label{font-size:14px;font-weight:700;color:var(--brown);}
  .switch{width:52px;height:28px;border-radius:999px;background:var(--cream);position:relative;cursor:pointer;transition:.2s;border:1px solid var(--pink-1);}
  .switch.on{background:var(--pink-3);border-color:var(--pink-3);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:.2s;}
  .switch.on::after{left:26px;}
  .switch-hint{font-size:11px;color:var(--brown-light);margin-top:4px;}

  /* 弹窗 */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(138,98,104,.35);z-index:100;justify-content:center;align-items:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{position:relative;background:var(--surface);border-radius:var(--radius);padding:22px;width:100%;max-width:360px;box-shadow:0 18px 50px rgba(255,143,171,.35);border:1px solid var(--pink-1);animation:modalIn .2s ease;}
  @keyframes modalIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
  .modal-title{font-size:16px;font-weight:800;color:var(--brown);margin-bottom:14px;}
  .modal-body{font-size:13px;color:var(--brown-light);line-height:1.6;margin-bottom:16px;max-height:60vh;overflow-y:auto;}
  .modal input{width:100%;padding:11px 14px;border:1px solid var(--pink-1);border-radius:var(--radius-sm);font-size:14px;color:var(--brown);outline:none;margin-bottom:10px;}
  .modal input:focus{border-color:var(--pink-3);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .modal-actions button{border:none;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;}
  .modal-actions .cancel{background:var(--cream);color:var(--brown);}
  .modal-actions .ok{background:linear-gradient(135deg,var(--pink-3),var(--pink-4));color:var(--surface);}
  .modal-close{position:absolute;right:14px;top:12px;width:32px;height:32px;border:none;border-radius:50%;background:#fff0f5;color:var(--pink-4);font-size:20px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 4px 10px rgba(255,143,171,.18);}
  .modal-close:hover{background:var(--pink-1);}
  .modal.form-modal{max-width:430px;padding:26px 26px 28px;}
  .modal.form-modal .modal-title{padding-right:34px;margin-bottom:18px;}
  .modal.form-modal .modal-body{margin-bottom:0;overflow:visible;}
  .nurture-form-modal .form-row{margin-bottom:16px;}
  .nurture-form-modal input{height:50px;margin-bottom:0;font-size:15px;}
  .nurture-form-modal .chip-grid{gap:12px 14px;margin:12px 0 18px;}
  .nurture-form-modal .chip-grid span{min-height:42px;font-size:14px;}
  .nurture-form-modal .btn-pink{height:54px;font-size:16px;margin-top:4px;}
  @media(max-width:680px){
    .modal.form-modal{max-width:min(92vw,430px);padding:22px 18px 20px;}
    .nurture-form-modal .chip-grid{grid-template-columns:1fr 1fr;gap:10px;}
  }
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0;}

  /* 改头像弹窗专用样式 */
  .ava-modal-body{display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow-y:auto;padding-right:2px;}

  .ava-upload-btn:active{transform:scale(0.98);}
  .ava-emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .ava-emoji-btn{font-size:20px;background:var(--cream);border:2px solid var(--pink-1);border-radius:10px;padding:4px;cursor:pointer;line-height:1;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:transform .12s,border-color .15s;}
  .ava-emoji-btn:active{transform:scale(0.92);}
  .ava-emoji-btn:hover{border-color:var(--pink-3);}
  .emoji-grid span{font-size:26px;text-align:center;cursor:pointer;padding:4px;border-radius:8px;}

  /* 账单图表 */
  .money-chart{height:160px;margin:14px 0;}

    .date-chip{font-size:10px;padding:3px 7px;}
    .fortune-total-num{font-size:42px;}
    .tarot-stage{width:140px;height:210px;}
    .tarot-card{width:140px;height:210px;}
    .tarot-symbol{font-size:52px;}
    .wheel-stage{width:200px;height:220px;flex-shrink:0;}
    .wheel-outer{width:180px;height:180px;}
    .wheel-svg .wheel-label{font-size:14px;}
    .wheel-svg .wheel-hub{font-size:14px;}
  }

  .theme-toggle{background:transparent;border:none;font-size:20px;cursor:pointer;padding:4px 6px;transition:transform .2s;line-height:1;position:absolute;right:22px;top:50%;transform:translateY(-50%);margin-left:0;}
  .theme-toggle:hover{transform:translateY(-50%) scale(1.15);}
  [data-theme="dark"]{
    --bg:#17131c;--bg-dot:#211a27;--panel:#1c1622;--cream:#2a2230;--surface:#332a3d;--english-card:#26202c;--english-accent:#ff9fb8;
    --pink-1:#4a2a38;--pink-2:#ff8fab;--pink-3:#ff8fab;--pink-4:#ff7096;
    --brown:#f3d9e0;--brown-light:#c9a8b3;
    --shadow:0 6px 18px rgba(0,0,0,.45);
  }
  [data-theme="dark"] [style*="background:var(--surface)"]{background:var(--surface)!important;}
  [data-theme="dark"] .avatar{border-color:var(--surface)!important;}
  [data-theme="dark"] .color-c.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pink-2)!important;}
  [data-theme="dark"] .day.selected{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pink-2)!important;}
  [data-theme="dark"] .avatar-hint{background:var(--pink-3)!important;border-color:var(--surface)!important;}

  @media(max-width:680px){
    .modal{width:92vw;max-width:92vw;padding:18px;}
  }

  /* ============== v32 全局滚动条隐藏 ============== */
  *{scrollbar-width:none;-ms-overflow-style:none;}
  *::-webkit-scrollbar{display:none;width:0;height:0;background:transparent;}
  *::-webkit-scrollbar-thumb{background:transparent;}

  /* ============== v32 oracle tab 视觉 ============== */
  .nav-item-oracle{background:linear-gradient(135deg,#f6e9ff,#ffe1f0);color:#7c3aed;border:1px solid #e9d5ff;}
  .nav-item-oracle.active{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(167,139,250,.4);}

  /* ============== v32 oracle sub-tab 切换 ============== */
  .oracle-tabs{display:flex;gap:8px;padding:14px 18px 6px;justify-content:center;background:var(--panel);border-bottom:1px solid var(--pink-1);position:sticky;top:0;z-index:5;}
  .oracle-tab{flex:1;max-width:120px;padding:9px 0;border-radius:999px;background:transparent;border:1px solid var(--pink-1);color:var(--brown);font-size:13px;font-weight:700;cursor:pointer;transition:all .25s;position:relative;}
  .oracle-tab.on{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(236,72,153,.3);transform:translateY(-1px);}

  /* ============== v32 综合运势 hero ============== */
  .fortune-hero{position:relative;background:linear-gradient(135deg,#ffe4f0,#fff0e0);border-radius:var(--radius);padding:22px 18px 24px;margin-bottom:18px;overflow:hidden;border:1px solid var(--pink-1);}
  .fortune-hero::before{content:'';position:absolute;top:-50px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,206,224,.5),transparent 70%);border-radius:50%;z-index:0;pointer-events:none;}
  .fortune-hero::after{content:'';position:absolute;bottom:-40px;left:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(254,215,170,.4),transparent 70%);border-radius:50%;z-index:0;pointer-events:none;}
  .fortune-hero-inner{position:relative;z-index:2;}
  .fortune-date{font-size:12px;color:var(--brown-light);letter-spacing:2px;margin-bottom:4px;}
  .fortune-total{display:flex;align-items:baseline;gap:8px;margin-top:8px;margin-bottom:8px;}
  .fortune-total-num{font-size:64px;font-weight:900;background:linear-gradient(135deg,#ff7096,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;letter-spacing:-2px;}
  .fortune-total-unit{font-size:14px;color:var(--brown-light);font-weight:700;}
  .fortune-total-label{font-size:13px;color:var(--brown);font-weight:700;}
  .fortune-grade{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:2px;}
  .fortune-grade.s{background:linear-gradient(135deg,#fbbf24,#f472b6);color:#fff;box-shadow:0 4px 12px rgba(244,114,182,.4);}
  .fortune-grade.a{background:linear-gradient(135deg,#86efac,#4ade80);color:#14532d;}
  .fortune-grade.b{background:linear-gradient(135deg,#7dd3fc,#38bdf8);color:#0c4a6e;}
  .fortune-grade.c{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#334155;}

  /* ============== v32 5 维分数显示 ============== */
  .fortune-row{background:var(--surface);border:1px solid var(--pink-1);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:44px 1fr 80px;gap:12px;align-items:center;box-shadow:var(--shadow);transition:transform .25s;}
  .fortune-row:hover{transform:translateY(-1px);}
  .fortune-row .fr-ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--cream),var(--pink-1));display:grid;place-items:center;font-size:22px;}
  .fortune-row .fr-name{font-weight:800;color:var(--brown);font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  .fortune-row .fr-score{font-size:11px;color:var(--brown-light);font-weight:700;}
  .fortune-row .fr-stars{font-size:10px;letter-spacing:1px;line-height:1;color:var(--pink-4);}
  .fortune-row .fr-stars .empty{opacity:.22;}
  .fortune-row .fr-text{font-size:12px;color:var(--brown-light);margin-top:3px;line-height:1.55;}
  .fortune-row .fr-bar{width:80px;height:8px;background:var(--cream);border-radius:4px;overflow:hidden;position:relative;}
  .fortune-row .fr-bar i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--pink-2),var(--pink-4));border-radius:4px;transition:width .8s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 8px rgba(255,143,171,.4);}
  .fortune-row .fr-bar b{position:absolute;top:-2px;right:0;font-size:9px;color:var(--brown-light);font-weight:700;}

  /* ============== v34 扁平风转盘(替换 3D 骰子)============== */
  .dice-page{padding:20px 18px 40px;display:flex;flex-direction:column;gap:16px;align-items:center;}
  .wheel-stage{position:relative;width:260px;height:280px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wheel-outer{position:relative;width:240px;height:240px;border-radius:50%;padding:6px;background:linear-gradient(135deg,#ffd6e8,#e0c5ff);box-shadow:0 12px 32px rgba(236,72,153,.22),0 0 0 6px var(--surface),0 0 0 7px var(--pink-2);box-sizing:border-box;}
  .wheel-svg{width:100%;height:100%;display:block;border-radius:50%;overflow:hidden;transform-box:fill-box;transform-origin:center;transition:transform 4s cubic-bezier(.17,.67,.12,.99);background:white;}
  .wheel-svg .wheel-seg{stroke:#fff;stroke-width:2;stroke-linejoin:round;}
  .wheel-svg .wheel-label{font-family:var(--font);font-weight:800;font-size:18px;fill:#fff;pointer-events:none;letter-spacing:1px;}
  .wheel-svg .wheel-hub{font-family:var(--font);font-weight:900;font-size:18px;fill:var(--pink-4);pointer-events:none;letter-spacing:1px;}
  .wheel-pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--pink-4);z-index:5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));}
  .wheel-pointer::after{content:'';position:absolute;top:-30px;left:-7px;width:14px;height:14px;background:#fff;border-radius:50%;border:3px solid var(--pink-4);box-sizing:border-box;}
  .dice-hint{font-size:13px;color:var(--brown-light);text-align:center;margin:4px 0 12px;letter-spacing:1px;position:relative;z-index:2;clear:both;}

  .dice-opts{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;}
  .dice-opt{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--pink-1);border-radius:var(--radius);padding:10px 12px;transition:.3s;}
  .dice-opt.selected{border-color:var(--pink-4);background:linear-gradient(135deg,#fff0f3,#ffe3eb);box-shadow:0 8px 22px rgba(255,143,171,.35);transform:scale(1.03);}
  .dice-opt.selected .dice-num{color:white;box-shadow:0 4px 10px rgba(255,143,171,.5);}
  .dice-opt .dice-num{width:28px;height:28px;border-radius:50%;color:white;font-size:12px;font-weight:800;display:grid;place-items:center;flex-shrink:0;transition:.3s;}
  .dice-opt input{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--brown);outline:none;padding:4px 0;min-width:0;}
  .dice-opt .dice-del{background:none;border:none;color:var(--brown-light);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;}
  .dice-opt .dice-del:hover{color:var(--pink-4);}

  .dice-add{display:flex;gap:8px;align-items:center;width:100%;max-width:420px;}
  .dice-add input{flex:1;background:var(--surface);border:2px solid var(--pink-1);border-radius:999px;padding:10px 16px;font-family:inherit;font-size:13px;color:var(--brown);outline:none;}
  .dice-add input:focus{border-color:var(--pink-3);}
  .dice-add button{background:linear-gradient(135deg,var(--pink-3),var(--pink-4));color:white;border:none;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .dice-add button:disabled{opacity:.4;cursor:not-allowed;}

  .dice-roll{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:white;border:none;padding:14px 40px;border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(139,92,246,.4);font-family:inherit;letter-spacing:2px;transition:.2s;}
  .dice-roll:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 30px rgba(139,92,246,.5);}
  .dice-roll:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .dice-warn{font-size:12px;color:#d97706;background:#fef3c7;padding:6px 12px;border-radius:999px;border:1px dashed #fcd34d;}
  .dice-result{font-size:14px;color:var(--brown);text-align:center;padding:10px 16px;background:linear-gradient(135deg,#fff0f3,#ffe3eb);border-radius:var(--radius);border:1px solid var(--pink-2);min-height:48px;display:flex;align-items:center;justify-content:center;line-height:1.5;width:100%;max-width:420px;}
  .dice-result b{color:var(--pink-4);font-size:18px;font-weight:900;margin:0 4px;}

  /* ============== v35 补回缺失的 oracle 三页 CSS ============== */
  /* —— 运势页 —— */
  .fortune-page{padding:18px 18px 40px;display:flex;flex-direction:column;gap:14px;}
  .fortune-list{display:flex;flex-direction:column;gap:10px;}
  .fortune-extra{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .fe{background:var(--surface);border:1px solid var(--pink-1);border-radius:var(--radius);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow);min-height:120px;justify-content:center;}
  .fe-swatch{width:54px;height:54px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.4);}
  .fe-label{font-size:11px;color:var(--brown-light);letter-spacing:2px;font-weight:700;}
  .fe-value{font-size:16px;color:var(--brown);font-weight:800;line-height:1.4;}
  .fortune-tip{background:linear-gradient(135deg,#fff7e6,#fff0f3);border:1px dashed var(--pink-2);border-radius:var(--radius);padding:12px 14px;font-size:13px;color:var(--brown);line-height:1.6;display:flex;gap:8px;align-items:flex-start;}
  .fortune-tip b{color:var(--pink-4);}

  /* —— 塔罗页 —— */
  .tarot-page{padding:20px 18px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .tarot-stage{perspective:900px;width:200px;height:300px;margin:6px auto 4px;flex-shrink:0;}
  .tarot-card{position:relative;width:200px;height:300px;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
  .tarot-card.flipped{transform:rotateY(180deg);}
  .tarot-face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;box-shadow:0 14px 32px rgba(167,139,250,.32),inset 0 0 0 2px rgba(255,255,255,.5);overflow:hidden;}
  .tarot-back{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;}
  .tarot-back::before,.tarot-back::after{content:'✦ ✦ ✦';position:absolute;font-size:14px;letter-spacing:6px;opacity:.55;font-weight:700;}
  .tarot-back::before{top:18px;left:0;right:0;text-align:center;}
  .tarot-back::after{bottom:18px;left:0;right:0;text-align:center;}
  .tarot-back .tb-tap{margin-top:auto;margin-bottom:auto;font-size:13px;letter-spacing:3px;opacity:.9;font-weight:700;background:rgba(255,255,255,.18);padding:8px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.4);}
  .tarot-front{background:linear-gradient(135deg,#fff0f3,#fdf6ff);transform:rotateY(180deg);}
  .tarot-front .tarot-symbol{font-size:72px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(167,139,250,.25));}
  .tarot-front .tarot-name{font-size:20px;font-weight:900;color:var(--brown);letter-spacing:4px;margin-bottom:4px;}
  .tarot-front .tarot-en{font-size:11px;color:var(--brown-light);letter-spacing:2px;margin-bottom:14px;font-style:italic;}
  .tarot-front .tarot-pos{display:inline-block;padding:4px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:2px;}
  .tarot-front .tarot-pos.upright{background:linear-gradient(135deg,#86efac,#4ade80);color:#14532d;}
  .tarot-front .tarot-pos.reversed{background:linear-gradient(135deg,#fda4af,#f43f5e);color:#fff;}
  .tarot-info{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;}
  .tarot-section{background:var(--surface);border:1px solid var(--pink-1);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
  .tarot-section h4{font-size:13px;color:var(--pink-4);margin-bottom:6px;font-weight:800;}
  .tarot-section p{font-size:13px;color:var(--brown);line-height:1.65;}
  .tarot-redraw{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;border:none;padding:11px 28px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(236,72,153,.3);font-family:inherit;letter-spacing:2px;transition:transform .2s;}
  .tarot-redraw:hover{transform:translateY(-2px);}

  /* —— 转盘空状态 —— */
  .dice-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 20px;color:var(--brown-light);text-align:center;}
  .dice-empty .de-ico{font-size:56px;opacity:.55;animation:wheelIdle 3s ease-in-out infinite;}
  .dice-empty .de-title{font-size:14px;color:var(--brown);font-weight:800;}
  .dice-empty .de-sub{font-size:12px;color:var(--brown-light);line-height:1.6;max-width:280px;}
  @keyframes wheelIdle{0%,100%{transform:rotate(0);}50%{transform:rotate(8deg);}}

  /* v64: garden and pet final mobile layout. */
  .garden-board-v64{margin:14px 16px 16px;border:2px solid #ffbfd0;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#fff,#fff8fb);box-shadow:0 8px 18px rgba(255,143,171,.1);}
  .garden-stage-v64{background-image:url("./generated-images/garden-empty-3plots.png");aspect-ratio:16/9;min-height:360px;max-height:520px;margin:0;overflow:hidden;background-size:cover;background-position:center;background-repeat:no-repeat;}
  .garden-stage-v64 .garden-plant-slot{bottom:14.2%;width:17.4%;height:34%;}
  .garden-stage-v64 .garden-plant-slot.slot-0{left:16.7%;}
  .garden-stage-v64 .garden-plant-slot.slot-1{left:40.85%;}
  .garden-stage-v64 .garden-plant-slot.slot-2{left:64.9%;}
  .garden-panel-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px 12px;background:rgba(255,255,255,.72);backdrop-filter:blur(3px);}
  .garden-panel-list .garden-overlay-item{margin:0;}

  /* v65: move v64 garden plants back into the soil beds. */

  /* v67: mobile garden polish + pet shop decorations. */
  .daily-love-btn{border:1.5px solid var(--pink-1);background:#fff;color:var(--pink-4);border-radius:999px;padding:8px 12px;font-family:var(--font);font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap;}
  .daily-love-btn.claimed{color:var(--brown-light);background:var(--cream);cursor:default;opacity:.78;}
  .pet-shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px;}
  .pet-shop-card{border:1.5px solid var(--pink-1);background:linear-gradient(180deg,#fff,#fff8fb);border-radius:14px;padding:10px;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;}
  .pet-shop-card img{width:58px;height:58px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 5px 5px rgba(95,55,65,.14));}

  .water-notify-switch>span{display:flex;flex-direction:column;gap:2px;line-height:1.1;}
  .water-notify-switch b{font-size:14px;color:#5b9fc4;}
  .water-notify-switch small{font-size:11px;font-weight:500;color:#9bb1c0;}
  .water-notify-switch>i{position:relative;display:block;flex:0 0 50px;width:50px;height:30px;border-radius:999px;background:#cbd2da;transition:.2s;}
  .water-notify-switch>i::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.2s;}

<script>
/* ================= 数据与工具 ================= */
const STORAGE_KEY='pinkWorkbench_v4';
const todayKey=()=>new Date().toISOString().slice(0,10);
const nowTime=()=>{const n=new Date();return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;};
function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme||'light');const btn=document.getElementById('themeToggle');if(btn)btn.textContent=(state.theme==='dark')?'🌙':'☀️';}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';saveState();applyTheme();}

function loadState(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);return ensureState(data);}}catch(e){console.error('loadState error',e);}
  return defaultState();
}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){
    console.error('saveState error',e);
    showModal({title:'保存失败',body:'本地存储空间不足，头像可能过大。建议导出备份后清空数据，或换一张更小的图片。',noCancel:true});
  }
}
function ensureState(data){
  const def=defaultState();
  Object.keys(def).forEach(k=>{if(!data[k]||typeof data[k]!=='object')data[k]=def[k];else data[k]={...def[k],...data[k]};});
  // v36 迁移:清理转盘里 v34 默认填充/fallback 的占位选项
  if(data.dice&&Array.isArray(data.dice.opts)){
    const legacy=new Set(['火锅','烧烤','日料','选项 A','选项 B']);
    data.dice.opts=data.dice.opts.filter(o=>{
      if(!o)return false;
      const t=String(o).trim();
      if(!t)return false;
      // 过滤 v34 fallback 的 "选项 1" / "选项 2" 等占位
      if(/^选项\s*[A-Za-z0-9]+$/.test(t))return false;
      // 过滤 v34 默认三连
      if(legacy.has(t))return false;
      return true;
    });
  }
  return data;
}

function defaultState(){
  const today=todayKey();
  return{
    theme:'light',
    profile:{name:'小美的工作台',avatarType:'emoji',avatar:'🐱',customAvatar:null},
    plan:{tab:'todo',activeCat:'all',categories:[
      {id:'supplement',icon:'💊',name:'补品类'},{id:'food',icon:'🍽️',name:'饮食'},
      {id:'work',icon:'💻',name:'工作'},{id:'study',icon:'📖',name:'学习'},{id:'life',icon:'🌸',name:'生活'}
    ],todos:[],schedule:[],memos:[],habits:[]},
    english:{tab:'words',linked:true,wordCount:3,sentenceCount:3,usedWordIdx:[],usedSentenceIdx:[],wordDate:'',sentenceDate:'',wordToday:[],sentenceToday:[],finishDate:''},
    sport:{tab:'today',items:[],week:[0,0,0,0,0,0,0]},
    money:{tab:'today',records:[],shopping:{pending:[],bought:[]}},
    period:{tab:'calendar',viewDate:today,currentStart:null,records:[],feelings:{}},
    tree:{tab:'diary',entries:[]},
    game:{energy:10,lastCheckin:'',streak:0},
    water:{day:today,goalSips:0,sipsPerReminder:1,intervalMin:60,active:false,notify:false,nextReminderAt:0,records:[],rewardedMilestone:0,customOpen:false,customUnit:'min'},

let state=loadState();

function migrateData(){
  // 迁移旧的 english.count
  if(state.english && 'count' in state.english){
    state.english.linked=true;
    state.english.wordCount=state.english.count;
    state.english.sentenceCount=state.english.count;
    delete state.english.count;
  }
  // 兼容新模块字段
  if(state.english && !('finishDate' in state.english))state.english.finishDate='';
  if(!state.game)state.game={energy:0,lastCheckin:'',streak:0};
  if(!state.game.v41EnergyReset){
    state.game.energy=999;
    state.game.v41EnergyReset=true;
  }
  if(!state.game.v58EnergyReset){
    state.game.energy=10;

  }
  if(!state.game.v74EnergyReset){

  if(!state.game.v77DebugReset){

  if(!state.garden)state.garden={plants:[],harvested:0};
  if(!state.pet)state.pet={owned:[],activeId:null};
  if(state.pet && Array.isArray(state.pet.owned) && !state.pet.v77InteractReset){
    const t=todayKey();
    state.pet.owned.forEach(p=>{
      if(!p.interactLog)p.interactLog={};
      p.interactLog[t]={pet:0,play:0};
    });
    state.pet.v77InteractReset=true;
  }
  if(state.pet && Array.isArray(state.pet.owned) && !state.pet.v75InteractReset){
    const t=todayKey();
    state.pet.owned.forEach(p=>{
      if(!p.interactLog)p.interactLog={};
      p.interactLog[t]={pet:0,play:0};
    });
    state.pet.v75InteractReset=true;
  }
  if(!state.tree)state.tree={tab:'diary',entries:[]};
  // 植物新字段兼容（moisture 实时水分 / lastMoistureTick 衰减基线）
  if(state.garden && Array.isArray(state.garden.plants)){
    state.garden.plants.forEach(p=>{
      if(typeof p.moisture!=='number')p.moisture=100;

  // 宠物新字段兼容（lastPetTick 衰减基线）
  if(state.pet && Array.isArray(state.pet.owned)){
    state.pet.owned.forEach(p=>{
      if(typeof p.hunger!=='number')p.hunger=80;
      if(typeof p.happiness!=='number')p.happiness=80;

  // 首次进入游戏化模块赠送默认植物/宠物
  if(state.garden && Array.isArray(state.garden.plants)&&!state.garden.v39EmptyStart){
    if(state.garden.plants.length===1 && state.garden.plants[0].type==='succulent')state.garden.plants=[];
    state.garden.v39EmptyStart=true;
  }
  if(state.pet && Array.isArray(state.pet.owned)&&!state.pet.owned.length){
    state.pet.owned.push({id:Date.now()+1,name:'小咪',icon:'🐱',type:'cat',typeName:'小猫咪',level:1,exp:0,hunger:80,happiness:80,lastPetTick:Date.now(),interactLog:{}});
    state.pet.activeId=state.pet.owned[0].id;
  }
  else if(!state.tree.tab)state.tree.tab='diary';
  // 习惯打卡旧数据迁移：logs boolean -> number；补齐 type/target/unit/category
  if(state.plan && Array.isArray(state.plan.habits)){
    state.plan.habits.forEach(h=>{
      if(!h.type)h.type='check';
      if(typeof h.target!=='number')h.target=1;
      if(!h.unit)h.unit=(h.type==='count'?'次':'天');
      if(!h.category)h.category='生活';
      if(h.logs && typeof h.logs==='object'){
        Object.keys(h.logs).forEach(k=>{if(typeof h.logs[k]==='boolean')h.logs[k]=h.logs[k]?1:0;});
      }
    });
  }
}

function seedHash(str){let h=0;for(let c of str){h=(h<<5)-h+c.charCodeAt(0);h|=0;}return Math.abs(h);}
function seededRandom(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280;}}
function pickByDate(arr,n,offset=0){
  const r=seededRandom(seedHash(todayKey())+offset);const copy=[...arr];
  for(let i=copy.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}
  return copy.slice(0,n);
}
function addDays(dateStr,days){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function fmtDateKey(d){return d.toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ================= 自定义滚动条 ================= */
function initCustomScrollbars(){
  document.querySelectorAll('.custom-scroll').forEach(scroller=>{
    if(scroller.dataset.scrollbarInit)return;
    scroller.dataset.scrollbarInit='1';
    let track=scroller.querySelector(':scope>.custom-scroll-track');
    let thumb=track?.querySelector('.custom-scroll-thumb');
    if(!track){track=div('custom-scroll-track');thumb=div('custom-scroll-thumb');track.appendChild(thumb);scroller.appendChild(track);}
    if(!thumb){thumb=div('custom-scroll-thumb');track.appendChild(thumb);}
    let dragging=false,dragStartY=0,dragStartScroll=0;
    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
    function update(){
      const ratio=scroller.clientHeight/(scroller.scrollHeight||1);
      if(ratio>=1||scroller.scrollHeight<=scroller.clientHeight){track.style.display='none';return;}
      track.style.display='block';
      const trackH=track.clientHeight;
      const thumbH=clamp(Math.floor(trackH*ratio),Math.floor(trackH*.45),Math.floor(trackH*.6));
      thumb.style.height=thumbH+'px';
      const maxScroll=scroller.scrollHeight-scroller.clientHeight;
      const maxTop=trackH-thumbH;
      const top=maxScroll>0?(scroller.scrollTop/maxScroll)*maxTop:0;
      thumb.style.top=clamp(top,0,maxTop)+'px';
    }
    scroller.addEventListener('scroll',()=>{
      update();
      scroller.classList.add('scrolling');
      clearTimeout(scroller._scrollTimer);
      scroller._scrollTimer=setTimeout(()=>scroller.classList.remove('scrolling'),700);
    });
    thumb.addEventListener('mousedown',e=>{
      dragging=true;dragStartY=e.clientY;dragStartScroll=scroller.scrollTop;e.preventDefault();
    });
    track.addEventListener('mousedown',e=>{
      if(e.target===thumb)return;
      const rect=track.getBoundingClientRect();
      const thumbTop=parseFloat(thumb.style.top)||0;
      const clickY=e.clientY-rect.top;
      const page=scroller.clientHeight*.8;
      scroller.scrollTop+=(clickY>thumbTop+thumb.clientHeight?page:-page);
    });
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      const trackH=track.clientHeight;
      const thumbH=thumb.clientHeight;
      const maxTop=trackH-thumbH;
      const maxScroll=scroller.scrollHeight-scroller.clientHeight;
      const delta=e.clientY-dragStartY;
      scroller.scrollTop=dragStartScroll+(delta/maxTop)*maxScroll;
    });
    document.addEventListener('mouseup',()=>dragging=false);
    new ResizeObserver(update).observe(scroller);
    const content=scroller.querySelector(':scope>*:not(.custom-scroll-track)');
    if(content)new ResizeObserver(update).observe(content);
    update();
  });
}
function refreshCustomScrollbars(){document.querySelectorAll('.custom-scroll').forEach(s=>{s.dataset.scrollbarInit='';});initCustomScrollbars();}

const pageTitles={plan:'每日计划',english:'英语学习',sport:'运动打卡',money:'记账',period:'经期记录',tree:'治愈花园',oracle:'今日占卜'};
let currentPage='plan';
let tarotFlipped=false;
let tarotOffset=0;

function switchPage(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const topbar=document.querySelector('.topbar');
  const sub=document.getElementById('pageSub');
  const titleEl=document.getElementById('pageTitle');
  const dateChip=document.getElementById('dateChip');
  const topbarTabs=document.getElementById('topbarTabs');
  if(page==='oracle'){
    if(titleEl)titleEl.style.display='none';
    if(dateChip)dateChip.style.display='none';
    if(sub)sub.textContent='';
    if(topbarTabs){
      topbarTabs.style.display='flex';
      // 高亮当前 sub-tab
      topbarTabs.querySelectorAll('.topbar-tab').forEach(b=>{
        b.classList.toggle('on',b.dataset.tab===state.oracleTab);
      });
    }
    if(topbar)topbar.classList.remove('has-sub');
  }else{
    if(titleEl)titleEl.style.display='';
    if(dateChip)dateChip.style.display='';
    if(topbarTabs)topbarTabs.style.display='none';
    if(sub)sub.textContent='';
    if(topbar)topbar.classList.remove('has-sub');
  }
  if(titleEl)titleEl.innerHTML=`<span class="ico">${pageIcons[page]}</span> ${pageTitles[page]}`;
  render();
}
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
// hash 直跳页(便于深链接/截图验证,生产环境不感知)
function _parseHashPage(){
  const h=location.hash.replace('#','').split('&')[0];
  return pageIcons[h]?h:null;
}
window.addEventListener('hashchange',()=>{const p=_parseHashPage();if(p)switchPage(p);});
// hash 第二段控制 oracle sub-tab(如 #oracle&tarot)
function _parseHashSub(){
  const seg=location.hash.replace('#','').split('&');
  return seg[1]||null;
}
// 开发态自动翻塔罗牌(URL 带 autoFlip=1 时触发,生产无影响)——必须在 switchPage 之前设
if(location.search.includes('autoFlip=1')){tarotFlipped=true;}
if(location.search.includes('autoRoll=1')||location.hash.includes('autoRoll=1')){window._autoRoll=true;}
const _initPage=_parseHashPage();
const _initSub=_parseHashSub();
if(_initSub==='fortune'||_initSub==='tarot'||_initSub==='dice')state.oracleTab=_initSub;
if(_initPage)switchPage(_initPage);
// 开发态自动转盘(URL 带 autoRoll=1 时触发,生产无影响)
if(window._autoRoll&&currentPage==='oracle'&&state.oracleTab==='dice'){setTimeout(()=>{spinWheel();},500);}

function render(){
  const box=document.getElementById('contentBox');box.innerHTML='';
  const now=new Date();
  document.getElementById('dateChip').textContent=`${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  try{
    tickGarden();
    renderProfile();
    switch(currentPage){
      case 'plan': renderPlan(box); break;
      case 'english': renderEnglish(box); break;
      case 'sport': renderSport(box); break;
      case 'money': renderMoney(box); break;
      case 'period': renderPeriod(box); break;
      case 'tree': renderTree(box); break;
      case 'oracle': renderOracle(box); break;
    }
  }catch(err){
    console.error('render error',err);
    box.innerHTML=`<div class="card"><div class="card-title">😵 页面渲染出错了</div><div class="card-sub">请刷新重试，或导出备份后清空数据。</div><pre style="font-size:11px;color:var(--brown-light);white-space:pre-wrap;">${esc(err.message)}</pre></div>`;
  }
  initCustomScrollbars();
}

function updateAppNameUI(){
  const an=document.getElementById('appName');if(an)an.textContent=state.profile.name;
  document.title=state.profile.name;
  const meta=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(meta)meta.setAttribute('content',state.profile.name);
  updateManifest();
}
function updateManifest(){
  try{
    if(window.__manifestUrl)URL.revokeObjectURL(window.__manifestUrl);
    const m={name:state.profile.name,short_name:state.profile.name,start_url:'./index.html',display:'standalone',background_color:'#fff5f7',theme_color:'#ff8fab',orientation:'portrait-primary',icons:[{src:'./icon-192.png?v=7',sizes:'192x192',type:'image/png'},{src:'./icon.png?v=7',sizes:'512x512',type:'image/png'}]};
    const blob=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
    window.__manifestUrl=URL.createObjectURL(blob);
    let link=document.querySelector('link[rel="manifest"]');if(!link){link=document.createElement('link');link.rel='manifest';document.head.appendChild(link);}
    link.href=window.__manifestUrl;
  }catch(e){}
}
function saveAppName(name){
  state.profile.name=name||'小美的工作台';saveState();
  const pn=document.getElementById('profileName');if(pn)pn.textContent=state.profile.name;
  updateAppNameUI();
}
function renderProfile(){
  const box=document.getElementById('avatarBox');
  if(!box)return;
  if(state.profile.avatarType==='custom'&&state.profile.customAvatar)box.innerHTML=`<img src="${state.profile.customAvatar}"/>`;else box.textContent=state.profile.avatar;
  const nameEl=document.getElementById('profileName');
  if(!nameEl)return;
  if(!nameEl.dataset.editing)nameEl.textContent=state.profile.name;
  updateAppNameUI();
}
function uploadAvatar(){document.getElementById('avatarFile').click();}
function resetAvatar(){state.profile.avatarType='emoji';state.profile.avatar='🐱';state.profile.customAvatar=null;saveState();renderAvatar();}
function handleAvatar(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();img.onload=()=>{
      const canvas=document.createElement('canvas');const size=120;
      canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');
      // 白色背景，避免 PNG 透明变黑
      ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
      const s=Math.min(img.width,img.height);const sx=(img.width-s)/2,sy=(img.height-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
      const dataUrl=canvas.toDataURL('image/jpeg',.6);
      // 估算大小，超过 30KB 再压缩
      const base64Len=dataUrl.length*0.75;
      if(base64Len>30*1024){
        const canvas2=document.createElement('canvas');canvas2.width=80;canvas2.height=80;
        const ctx2=canvas2.getContext('2d');ctx2.fillStyle='#fff';ctx2.fillRect(0,0,80,80);
        ctx2.drawImage(img,sx,sy,s,s,0,0,80,80);
        state.profile.customAvatar=canvas2.toDataURL('image/jpeg',.5);
      }else{
        state.profile.customAvatar=dataUrl;
      }
      state.profile.avatarType='custom';saveState();renderAvatar();hideModal();showHeartToast(1);
    };
    img.onerror=()=>showModal({title:'图片加载失败',body:'无法读取该图片，请换一张试试。',noCancel:true});
    img.src=e.target.result;
  };
  reader.onerror=()=>showModal({title:'读取失败',body:'无法读取文件，请重试。',noCancel:true});
  reader.readAsDataURL(file);input.value='';
}

/* ================= 自定义弹窗 ================= */
let modalResolve=null;
function showModal({title='提示',body='',input=false,inputValue='',placeholder='',noCancel=false,render=null}){
  const ov=document.getElementById('modalOverlay');const box=document.getElementById('modalBox');
  document.getElementById('modalTitle').textContent=title;
  const bodyEl=document.getElementById('modalBody');bodyEl.innerHTML=body;
  const extra=document.getElementById('modalExtra');extra.innerHTML='';
  const acts=document.getElementById('modalActions');acts.innerHTML='';
  let inputEl=null;
  if(input){inputEl=document.createElement('input');inputEl.value=inputValue;inputEl.placeholder=placeholder;extra.appendChild(inputEl);}
  if(render)render(bodyEl,extra);
  const okBtn=document.createElement('button');okBtn.className='ok';okBtn.textContent='确定';
  okBtn.onclick=()=>{const val=inputEl?inputEl.value.trim():true;const r=modalResolve;hideModal();if(r)r(val);};
  acts.appendChild(okBtn);
  if(!noCancel){const cBtn=document.createElement('button');cBtn.className='cancel';cBtn.textContent='取消';cBtn.onclick=()=>{const r=modalResolve;hideModal();if(r)r(null);};acts.appendChild(cBtn);}
  ov.classList.add('show');if(inputEl)setTimeout(()=>inputEl.focus(),50);
  setTimeout(()=>initCustomScrollbars(),0);
  return new Promise(r=>modalResolve=r);
}
function showConfirm(body){return showModal({title:'请确认',body,noCancel:false});}
function hideModal(){document.getElementById('modalOverlay').classList.remove('show');modalResolve=null;}

/* ================= v81 喝水提醒 ================= */
let waterTicker=null;
function ensureWaterState(){
  const today=todayKey();
  if(!state.water||typeof state.water!=='object')state.water={};
  const w=state.water;
  if(w.day!==today){w.day=today;w.records=[];w.nextReminderAt=0;w.active=false;w.goalReached=false;}
  w.goalSips=Math.max(1,Math.min(200,parseInt(w.goalSips)||40));
  w.sipsPerReminder=1;
  w.intervalMin=Math.max(1,parseInt(w.intervalMin)||60);
  if(!Array.isArray(w.records))w.records=[];
  if(!w.deviceId)w.deviceId=crypto.randomUUID?.()||('pw-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  return w;
}
const PUSH_API='https://pink-workbench-push.huangzero2004.workers.dev';
async function pushFetch(url,options={},timeout=15000,retries=1){
  let lastErr;
  for(let attempt=0;attempt<=retries;attempt++){
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);
    try{return await fetch(url,{...options,signal:controller.signal,keepalive:true});}
    catch(err){lastErr=err;await new Promise(r=>setTimeout(r,300*attempt));}
    finally{clearTimeout(timer);}
  }
  throw lastErr;
}
function pushBytes(value){const padded=value.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((value.length+3)%4);const raw=atob(padded);return Uint8Array.from(raw,c=>c.charCodeAt(0));}
async function syncRemoteReminder(){
  const w=ensureWaterState();if(!w.pushSubscribed)return;
  await pushFetch(`${PUSH_API}/devices/${encodeURIComponent(w.deviceId)}/reminder`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({active:w.active,intervalMin:w.intervalMin,nextReminderAt:w.nextReminderAt})}).catch(()=>{});
}
async function subscribeRemotePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error('当前设备不支持 Web Push');
  const w=ensureWaterState();
  const registration=await navigator.serviceWorker.ready;
  const keyResponse=await pushFetch(`${PUSH_API}/vapid-public-key`);
  if(!keyResponse.ok)throw new Error('后台密钥获取失败');
  const keyData=await keyResponse.json();
  let subscription=await registration.pushManager.getSubscription();
  if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushBytes(keyData.publicKey)});
  const response=await pushFetch(`${PUSH_API}/devices/${encodeURIComponent(w.deviceId)}/subscribe`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription,active:w.active,intervalMin:w.intervalMin,nextReminderAt:w.nextReminderAt})});
  if(!response.ok)throw new Error('后台订阅保存失败');
  w.pushSubscribed=true;w.notify=true;saveState();return subscription;
}
async function unsubscribeRemotePush(){
  const w=ensureWaterState();
  w.pushSubscribed=false;w.notify=false;saveState();
  updateWaterNotifyUi(false,false);
  await pushFetch(`${PUSH_API}/devices/${encodeURIComponent(w.deviceId)}`,{method:'DELETE'}).catch(()=>{});
}
function waterTotal(){return ensureWaterState().records.reduce((sum,row)=>sum+(parseInt(row.sips)||0),0);}
function waterTime(ms){
  if(!ms||ms<=0)return '现在可以开始';
  const total=Math.ceil(ms/1000),minutes=Math.floor(total/60),seconds=total%60;
  return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}
function waterProgress(){const w=ensureWaterState();return Math.min(100,Math.round(waterTotal()/w.goalSips*100));}

  const running=w.active&&w.nextReminderAt>Date.now();

    <div class="card-title"><span>💧 喝水提醒</span><div class="water-head-actions"><span style="font-size:11px;color:#8ba0af;">${notifyReady?'通知已开启':'页面提醒'}</span><button class="water-icon-btn" onclick="openWaterGuide()" title="喝水提醒设置">⚙️</button></div></div>
    <div class="card-sub">每次喝几口，轻松完成今天的喝水目标</div>
    <div class="water-hero"><div><span>距离下次喝水</span><strong class="water-countdown" id="waterCountdown">${running?waterTime(w.nextReminderAt-Date.now()):'--:--'}</strong><small>每 ${w.intervalMin} 分钟提醒一次 · 每次 ${w.sipsPerReminder} 口</small></div><div class="water-drop">💧</div></div>
    <div class="water-progress"><i style="width:${percent}%"></i></div>
    <div class="water-progress-line"><span>今日进度</span><b>${total} / ${w.goalSips} 口（${percent}%）</b></div>
