<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>塔罗 · AI 大牌样张（风格统一度）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fbf7fb;font-family:"Nunito","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#4a3b46;padding:30px 26px 36px;}
  h1{font-size:19px;text-align:center;letter-spacing:2px;margin-bottom:6px;}
  .sub{text-align:center;font-size:12px;color:#a08b9c;margin-bottom:22px;}
  .row{display:flex;gap:22px;justify-content:center;align-items:flex-start;}
  figure{display:flex;flex-direction:column;align-items:center;gap:9px;}
  img{width:228px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;box-shadow:0 12px 26px rgba(120,80,120,.2);}
  figcaption{font-size:12px;font-weight:800;color:#8a6d84;letter-spacing:.5px;text-align:center;line-height:1.45;}
  figcaption i{display:block;font-style:normal;font-size:10px;color:#b3a0ae;font-weight:600;}
</style>
</head>
<body>
  <h1>🎴 AI 生成 · 大牌样张（5 张）</h1>
  <div class="sub">同一套提示词（新艺术 / 金框 / 淡紫·藕粉·古金）· medium 质量</div>
  <div class="row">
    <figure>
      <img src="../tarot-sample/ai-fool.png" />
      <figcaption>0 愚者<i>The Fool · high</i></figcaption>
    </figure>
    <figure>
      <img src="../tarot-sample/ai-02-high-priestess.png" />
      <figcaption>II 女祭司<i>The High Priestess</i></figcaption>
    </figure>
    <figure>
      <img src="../tarot-sample/ai-03-empress.png" />
      <figcaption>III 皇后<i>The Empress</i></figcaption>
    </figure>
    <figure>
      <img src="../tarot-sample/ai-13-death.png" />
      <figcaption>XIII 死神<i>Death</i></figcaption>
    </figure>
    <figure>
      <img src="../tarot-sample/ai-19-sun.png" />
      <figcaption>XIX 太阳<i>The Sun</i></figcaption>
    </figure>
  </div>
</body>
</html>
