<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>塔罗牌背候选</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fbf7fb;font-family:"Nunito","PingFang SC",system-ui,sans-serif;padding:26px;color:#4a3b46;}
  h1{font-size:19px;text-align:center;letter-spacing:2px;}
  .sub{text-align:center;font-size:12px;color:#a08b9c;margin:8px 0 22px;}
  .row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;width:1180px;margin:0 auto;}
  figure{display:flex;flex-direction:column;align-items:center;gap:8px;}
  img{width:180px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;
    box-shadow:0 10px 22px rgba(120,80,120,.2),inset 0 0 0 2px rgba(255,255,255,.8);}
  figcaption{font-size:13px;font-weight:800;color:#8a6d84;}
  .tag{font-size:10px;color:#fff;background:#ec4899;border-radius:999px;padding:2px 9px;}
</style>
</head>
<body>
  <h1>🎴 牌背候选（白色系 / 粉色系 · 典雅）</h1>
  <div class="sub">选一个编号告诉我，我就替换上线</div>
  <div class="row" id="r"></div>
<script>
const items=[
  {f:'back-1.png',n:'1 藕粉 · 白金玫瑰藤蔓'},
  {f:'back-2.png',n:'2 纯白 · 淡金月相环'},
  {f:'back-3.png',n:'3 米白 · 金藤新月'},
  {f:'back-4.png',n:'4 淡粉 · 金藤新月'},
  {f:'back-5.png',n:'5 樱花粉 · 金箔曼陀罗'},
  {f:'back-6.png',n:'6 珍珠白 · 银星轨'}
];
document.getElementById('r').innerHTML=items.map(it=>
  '<figure><img src="../tarot-back/'+it.f+'"><figcaption>'+it.n+'</figcaption></figure>').join('');
</script>
</body>
</html>
