<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>塔罗对比 · 愚者</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fbf7fb;font-family:"Nunito","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#4a3b46;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:34px;}
  h1{font-size:20px;letter-spacing:2px;}
  .row{display:flex;gap:40px;align-items:flex-start;}
  figure{display:flex;flex-direction:column;align-items:center;gap:12px;}
  figcaption{font-size:14px;font-weight:800;color:#8a6d84;letter-spacing:1px;}
  img{width:300px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;box-shadow:0 14px 30px rgba(120,80,120,.22);}
  /* 代码生成牌面：与预览页一致 */
  .card{width:300px;aspect-ratio:2/3;border-radius:14px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:16px 14px 18px;border:3px solid #e8c85f;box-shadow:0 14px 30px rgba(120,80,120,.22);
    background:linear-gradient(160deg,#b79bfb,#f27fb0);}
  .card::after{content:'';position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.55);border-radius:9px;pointer-events:none;}
  .cd-num{font-size:22px;font-weight:900;color:#fff;letter-spacing:2px;align-self:flex-start;padding-left:6px;text-shadow:0 1px 3px rgba(0,0,0,.2);}
  .cd-art{flex:1;width:100%;display:flex;align-items:center;justify-content:center;}
  .medal{width:58%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.96),rgba(255,255,255,.6));
    box-shadow:0 0 0 3px rgba(255,255,255,.8),0 8px 18px rgba(80,40,80,.2);font-size:78px;line-height:1;}
  .cd-name{font-size:26px;font-weight:900;color:#fff;text-align:center;line-height:1.1;text-shadow:0 2px 4px rgba(0,0,0,.24);}
  .cd-name i{display:block;font-size:12px;font-weight:600;opacity:.82;font-style:normal;letter-spacing:2px;margin-top:4px;}
</style>
</head>
<body>
  <h1>🎴 愚者 The Fool · 两种方案对比</h1>
  <div class="row">
    <figure>
      <img src="../tarot-sample/ai-fool.png" alt="AI 生成" />
      <figcaption>AI 生成（image_gen）</figcaption>
    </figure>
    <figure>
      <div class="card">
        <div class="cd-num">0</div>
        <div class="cd-art"><div class="medal">🃏</div></div>
        <div class="cd-name">愚者<i>THE FOOL</i></div>
      </div>
      <figcaption>代码生成（程序化绘制）</figcaption>
    </figure>
  </div>
</body>
</html>
